<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ковчег — как добраться</title>

<body>
<template id="x-dc">
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&amp;family=Oranienbaum&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F8F3}
a{color:inherit}
.k{font-family:'Jost',system-ui,sans-serif;color:#0E1F18;background:#F7F8F3;font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
.k *{box-sizing:border-box}
.wrap{max-width:1360px;margin:0 auto;padding:0 40px;position:relative}
.d{font-family:'Oranienbaum',serif;font-weight:400;line-height:.95;margin:0}
.lnk{font-weight:600;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;display:inline-flex;align-items:center;min-height:44px}
.lnk:hover{color:#C4502E}
.tk-v{-webkit-mask:radial-gradient(circle 11px at 50% 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 11px at 50% 100%,#0000 97%,#000) bottom/100% 51% no-repeat;mask:radial-gradient(circle 11px at 50% 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 11px at 50% 100%,#0000 97%,#000) bottom/100% 51% no-repeat}
.gr{position:relative;overflow:hidden;background:#12392B}
.gr img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.78) contrast(1.06) brightness(.98) sepia(.14)}
.gr::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(242,179,61,.12) 0%,rgba(18,57,43,.22) 100%);mix-blend-mode:multiply}
.h2{font-size:clamp(52px,5.4vw,88px);color:#12392B}

.hdr{position:absolute;left:0;right:0;top:0;z-index:5;color:#F7F8F3}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:92px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.logo svg{width:46px;height:46px}
.logo b{font-family:'Oranienbaum',serif;font-weight:400;font-size:34px;line-height:1}
.logo small{display:block;font-size:13px;opacity:.8;margin-top:2px}
.nav{display:flex;gap:28px;flex-wrap:wrap}
.nav a{text-decoration:none;font-size:16px;font-weight:500;padding:10px 0;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.nav a:hover{color:#F2B33D}
.nav a.on{box-shadow:inset 0 -2px 0 #F2B33D}

/* hero: full photo */
.hero{position:relative;height:720px;color:#F7F8F3}
.hero .gr{position:absolute;inset:0}
.hero .gr img{object-position:50% 60%}
.hero .shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(11,42,31,.55) 0%,rgba(11,42,31,0) 28%,rgba(11,42,31,0) 45%,rgba(11,42,31,.88) 100%)}
.hero .txt{position:absolute;left:0;right:0;bottom:48px;z-index:2}
.hero h1{font-size:clamp(84px,10vw,160px);text-shadow:0 6px 30px rgba(0,0,0,.4)}
.meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.meta span{padding:12px 18px;border-radius:6px;background:rgba(247,248,243,.14);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(247,248,243,.25);font-size:16px}
.meta small{display:block;font-size:13px;opacity:.8}
.meta b{font-weight:600}

/* hours */
.hours-sec{padding:100px 0 60px}
.hours-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:56px;align-items:start}
.hours-grid p{color:#4F6157;margin:20px 0 0}
.htable{background:#fff;box-shadow:0 1px 0 rgba(14,31,24,.06),0 34px 54px -38px rgba(14,31,24,.6)}
.hr{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.7fr) minmax(0,1fr);gap:12px;padding:20px 26px;border-bottom:1px solid rgba(14,31,24,.08);align-items:baseline}
.hr:last-child{border-bottom:0}
.hr.head{padding:16px 26px;font-size:14px;font-weight:600;color:#4F6157}
.hr b{font-family:'Oranienbaum',serif;font-weight:400;font-size:32px;line-height:1;color:#12392B}
.hr span{font-size:16px}
.hr.now{background:#12392B;color:#F7F8F3}
.hr.now b{color:#F2B33D}
.hr.now .badge{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:3px;background:#F2B33D;color:#0E1F18;font-size:12px;font-weight:600}

/* travel-time bars */
.ways{padding:60px 0 100px}
.bars{display:flex;flex-direction:column;gap:14px;margin-top:40px}
.bar{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:center}
.bar h3{margin:0;font-size:20px}
.bar h3 small{display:block;font-size:14px;font-weight:400;color:#4F6157;margin-top:2px}
.track{position:relative;height:64px;background:#E3EBE1;border-radius:6px;overflow:hidden}
.fill{height:100%;display:flex;align-items:center;justify-content:flex-end;padding:0 18px;background:#12392B;color:#F7F8F3;border-radius:6px;box-shadow:0 12px 20px -12px rgba(11,42,31,.7);transition:filter .2s}
.bar:hover .fill{filter:brightness(1.15)}
.fill b{font-family:'Oranienbaum',serif;font-weight:400;font-size:32px}
.bar.fast .fill{background:#F2B33D;color:#0E1F18}
.gates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:56px;filter:drop-shadow(0 16px 18px rgba(14,31,24,.16))}
.gate{background:#fff;padding:24px 24px}
.gate small{font-size:14px;font-weight:600;color:#C4502E}
.gate h3{margin:6px 0 4px;font-family:'Oranienbaum',serif;font-weight:400;font-size:34px;color:#12392B}
.gate p{margin:0;color:#3D4D44;font-size:16px}

/* scenarios */
.who{background:#12392B;color:#F7F8F3;padding:110px 0}
.who .h2{color:#F7F8F3}
.who .lead{color:#CFDDD3;font-size:19px;max-width:620px;margin:20px 0 0}
.sc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-top:48px;border-top:1px solid rgba(247,248,243,.18)}
.sc{padding:30px 32px 32px 0;border-bottom:1px solid rgba(247,248,243,.18);transition:background .2s}
.sc:nth-child(even){padding-left:32px;border-left:1px solid rgba(247,248,243,.18)}
.sc:hover{background:rgba(247,248,243,.04)}
.sc h3{font-family:'Oranienbaum',serif;font-weight:400;font-size:38px;line-height:1;margin:0 0 18px}
.sc dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 14px;margin:0;font-size:16px}
.sc dt{color:#B7CBBE}
.sc dd{margin:0}
.sc .tip{display:inline-block;margin-top:16px;padding:10px 14px;background:#F2B33D;color:#0E1F18;font-size:15px;border-radius:3px;box-shadow:0 12px 20px -12px rgba(0,0,0,.7)}

/* services with photos */
.serv{padding:110px 0}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:44px}
.sv{background:#fff;display:flex;flex-direction:column;box-shadow:0 1px 0 rgba(14,31,24,.06),0 30px 46px -32px rgba(14,31,24,.55);transition:transform .25s}
.sv:hover{transform:translateY(-4px)}
.sv .gr{height:220px}
.sv .b{padding:22px 24px 24px;display:flex;flex-direction:column;gap:6px}
.sv small{font-size:14px;font-weight:600;color:#C4502E}
.sv h3{margin:0;font-family:'Oranienbaum',serif;font-weight:400;font-size:34px;color:#12392B;line-height:1.05}
.sv p{margin:0;color:#3D4D44;font-size:16px}
.sv.green{background:#12392B;color:#F7F8F3}
.sv.green h3{color:#F7F8F3}.sv.green p{color:#CFDDD3}.sv.green small{color:#F2B33D}
.sv.gold{background:#F2B33D}
.sv.gold small{color:#0E1F18}
.maplink{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;margin-top:24px;padding:22px 26px;background:#E3EBE1;border-radius:4px}

.rules{background:#E3EBE1;padding:110px 0}
.rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:44px;filter:drop-shadow(0 16px 18px rgba(14,31,24,.16))}
.rule{background:#fff;padding:26px 22px}
.rule b{display:block;font-family:'Oranienbaum',serif;font-weight:400;font-size:34px;line-height:1.05;color:#12392B;margin-bottom:10px}
.rule p{margin:0;color:#3D4D44;font-size:16px}
.foot{background:#0B2A1F;color:#B7CBBE;padding:56px 0 36px;font-size:15px}
.foot .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
.foot .logo{color:#F7F8F3}
@media (max-width:1000px){
  .wrap{padding:0 16px}
  .hours-grid,.gates,.sc-grid,.sgrid,.rgrid{grid-template-columns:minmax(0,1fr)}
  .sc,.sc:nth-child(even){padding:24px 0;border-left:0}
  .hr{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:16px}
  .hr span:nth-child(3),.hr span:nth-child(4){display:none}
  .bar{grid-template-columns:minmax(0,1fr);gap:8px}
  .hero{height:560px}
  .nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:20px;scrollbar-width:none}.nav a{white-space:nowrap}
}

/* ——— shared kit ——— */
.k-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k-lnk{all:unset;box-sizing:border-box;cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;display:inline-flex;align-items:center;min-height:44px}
.k-lnk:hover{color:#C4502E}
.k-lnk:focus-visible,.k-cart:focus-visible,.k-buy:focus-visible,.k-x:focus-visible,.k-subbtn:focus-visible{outline:3px solid #F2B33D;outline-offset:3px}
.k-hr{display:flex;align-items:center;gap:18px}
.k-cart{position:relative;display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:#12392B;color:#F7F8F3;text-decoration:none;box-shadow:0 10px 18px -10px rgba(11,42,31,.7);transition:transform .2s}
.k-cart:hover{transform:translateY(-2px);color:#F7F8F3}
.k-cart svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.k-cart b{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#F2B33D;color:#0E1F18;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.k-buy{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:stretch;min-height:58px;color:#0E1F18;background:#F2B33D;font-family:'Jost',sans-serif;font-weight:600;font-size:17px;border-radius:8px;transition:transform .2s;
  -webkit-mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat}
.k-buy span{display:flex;align-items:center;padding:0 22px 0 28px}
.k-buy i{font-style:normal;display:flex;align-items:center;padding:0 26px 0 18px;border-left:2px dashed rgba(14,31,24,.35)}
.k-buy:hover{transform:translateY(-2px);color:#0E1F18}
.k-shadow{display:inline-block;filter:drop-shadow(0 12px 14px rgba(150,100,20,.35))}
.k-foot{background:#0B2A1F;color:#B7CBBE;padding:80px 0 36px;font-size:16px}
.k-foot .logo{color:#F7F8F3}.k-foot .logo small{color:#8FA898}
.k-foot-top{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:40px}
.k-faddr{margin:22px 0 0;line-height:1.6}
.k-faddr .k-lnk{min-height:0;color:#F7F8F3}
.k-foot h4{font-size:15px;font-weight:600;color:#F7F8F3;margin:0 0 14px}
.k-foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.k-foot ul a,.k-foot-bot a{text-decoration:none}.k-foot ul a:hover,.k-foot-bot a:hover{color:#F2B33D}
.k-sub{display:flex;gap:8px;margin-top:24px;max-width:460px}
.k-sub input{flex:1;min-width:0;height:50px;padding:0 16px;border-radius:6px;border:1.5px solid rgba(247,248,243,.3);background:rgba(247,248,243,.06);color:#F7F8F3;font:inherit}
.k-sub input::placeholder{color:#8FA898}
.k-subbtn{all:unset;box-sizing:border-box;cursor:pointer;height:50px;padding:0 20px;border-radius:6px;background:#F2B33D;color:#0E1F18;font-weight:600}
.k-foot-bot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:56px;padding-top:22px;border-top:1px solid rgba(247,248,243,.14);font-size:13px;color:#8FA898}
.k-credits{margin:14px 0 0;font-size:12px;line-height:1.6;color:#7E9587}
.k-veil{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(6,20,14,.62);backdrop-filter:blur(4px)}
.k-modal{position:relative;width:min(580px,100%);background:#12392B;color:#F7F8F3;border-radius:8px;border:6px solid #0F3123;padding:40px 38px 32px;box-shadow:0 2px 0 #0B2A1F,0 50px 90px -24px rgba(0,0,0,.75)}
.k-bolt{position:absolute;top:10px;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#EDE8DA,#8E8A7E)}
.k-mtag{display:inline-block;padding:4px 12px;border-radius:999px;background:#F2B33D;color:#0E1F18;font-size:13px;font-weight:600}
.k-mh{font-family:'Oranienbaum',serif;font-weight:400;font-size:44px;line-height:1;margin:16px 0 14px}
.k-mp{margin:0;color:#CFDDD3;font-size:17px;line-height:1.55}
.k-mrow{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:26px}
.k-back{color:#F7F8F3}
.k-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:55;display:flex;align-items:center;gap:16px;padding:12px 12px 12px 20px;border-radius:8px;background:#12392B;color:#F7F8F3;box-shadow:0 24px 40px -14px rgba(0,0,0,.6);font-size:15px;max-width:calc(100% - 32px)}
.k-toastgo{padding:10px 16px;border-radius:6px;background:#F2B33D;color:#0E1F18;font-weight:600;text-decoration:none;white-space:nowrap}
.k-x{all:unset;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#B7CBBE}
.k-field{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:600}
.k-field input,.k-field select,.k-field textarea{font:inherit;font-weight:400;font-size:17px;padding:13px 15px;border:1.5px solid #CBD5CD;border-radius:6px;background:#fff;color:#0E1F18}
.k-field textarea{min-height:120px;resize:vertical}
.k-field input:focus,.k-field select:focus,.k-field textarea:focus{outline:3px solid #F2B33D;outline-offset:1px;border-color:#12392B}
.k-check{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4}
.k-check input{width:20px;height:20px;margin:2px 0 0;accent-color:#12392B}
@media (max-width:1000px){
  .k-foot-top{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .k-foot-top>div:first-child{grid-column:1 / -1}
  .k-hr .k-lnk{display:none}
  .k-modal{padding:32px 20px 24px}
  .k-mh{font-size:34px}
  .k-toast{left:16px;right:16px;transform:none;flex-wrap:wrap}
}

</style>
</helmet>

<div class="k">
  <header class="hdr"><div class="wrap">
    <a class="logo" href="index.html" aria-label="Ковчег, на главную">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M11.5 19 L20 11.5 L28.5 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></path><rect x="14.5" y="19" width="11" height="7" fill="none" stroke="currentColor" stroke-width="2.4"></rect><path d="M4 26 H36 L31 33 H9 Z" fill="currentColor"></path><path d="M5 37.5 q3.75 -2.5 7.5 0 t7.5 0 t7.5 0 t7.5 0" fill="none" stroke="#F2B33D" stroke-width="2" stroke-linecap="round"></path></svg>
      <span><b>Ковчег</b><small>зоопарк, Минск</small></span>
    </a>
    <nav class="nav" aria-label="Главное меню">
      <a href="animals.html">Животные</a>
      <a href="index.html#map">Карта</a>
      <a href="tickets.html">Билеты</a>
      <a href="experiences.html">Впечатления</a>
      <a class="on" aria-current="page" href="visit.html">Как добраться</a>
      <a href="about.html">О зоопарке</a>
    </nav>
    <div class="k-hr">
      <button class="k-lnk" type="button" onClick="{{callDemo}}">+375 17 000-00-00</button>
      <a class="k-cart" href="cart.html" aria-label="Корзина"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg><sc-if value="{{hasCart}}"><b>{{cartCount}}</b></sc-if></a>
    </div>
  </div></header>

  <section class="hero">
    <div class="gr"><img src="img/flamingo.jpg" alt="Стая фламинго в полёте над водой"></div>
    <div class="shade" aria-hidden="true"></div>
    <div class="txt"><div class="wrap">
      <h1 class="d">Как добраться</h1>
      <div class="meta">
        <span><small>Адрес</small><b>Минск, ул. Зелёная Роща, 1</b></span>
        <span><small>От центра</small><b>25 минут на машине</b></span>
        <span><small>Выходные дни</small><b>нет</b></span>
      </div>
    </div></div>
  </section>

  <section class="hours-sec">
    <div class="wrap">
      <div class="hours-grid">
        <div>
          <h2 class="d h2">Часы работы</h2>
          <p>Без выходных. Касса закрывается за час до парка. В дни штормового предупреждения открыты только павильоны — объявление появится здесь за два часа до открытия.</p>
        </div>
        <div class="htable">
          <div class="hr head"><span>Сезон</span><span>Парк</span><span>Касса</span><span>Тропики и Арктика</span></div>
          <div class="hr now"><span>Зима <span class="badge">сейчас</span><br><small style="opacity:.8">1 окт — 30 апр</small></span><b>10:00–17:00</b><span>до 16:00</span><span>10:00–16:30</span></div>
          <div class="hr"><span>Лето<br><small style="color:#4F6157">1 мая — 30 сен</small></span><b>9:00–20:00</b><span>до 19:00</span><span>9:30–19:30</span></div>
          <div class="hr"><span>31 декабря</span><b>10:00–15:00</b><span>до 14:00</span><span>10:00–14:30</span></div>
          <div class="hr"><span>1 января</span><b>11:00–17:00</b><span>до 16:00</span><span>11:00–16:30</span></div>
        </div>
      </div>
    </div>
  </section>

  <section class="ways">
    <div class="wrap">
      <h2 class="d h2">Сколько ехать из центра</h2>
      <div class="bars">
        <div class="bar fast"><h3>Такси<small>высадка у главного входа</small></h3><div class="track"><div class="fill" style="width:50%"><b>20 мин</b></div></div></div>
        <div class="bar"><h3>На машине<small>от МКАД на Зелёную Рощу, 600 мест</small></h3><div class="track"><div class="fill" style="width:62.5%"><b>25 мин</b></div></div></div>
        <div class="bar"><h3>Метро и автобус<small>№ 49 до «Зоопарк Ковчег», 12 минут</small></h3><div class="track"><div class="fill" style="width:87.5%"><b>35 мин</b></div></div></div>
        <div class="bar"><h3>Велосипед<small>от парка Городской Вал, 80 мест</small></h3><div class="track"><div class="fill" style="width:100%"><b>40 мин</b></div></div></div>
      </div>
      <div class="gates">
        <div class="gate tk-v"><small>в часы работы</small><h3>Главный вход</h3><p>Кассы, прокат колясок, бюро находок.</p></div>
        <div class="gate tk-v"><small>с 9:00 · по заявке</small><h3>Южный вход</h3><p>Группы, школы, автобусы и участники ночёвки.</p></div>
        <div class="gate tk-v"><small>только летом</small><h3>Вход «Пуща»</h3><p>Для велосипедистов и пешеходов со стороны леса.</p></div>
      </div>
    </div>
  </section>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":5400}}'>
class Component extends DCLogic {
  kitInit() {
    let n = 0;
    try { const c = JSON.parse(localStorage.getItem('kovcheg-cart') || '[]'); n = c.reduce((s, x) => s + (x.qty || 0), 0); } catch (e) {}
    this.setState({ cartCount: n });
    setTimeout(() => { try { const h = location.hash.slice(1); const el = h && document.getElementById(h); if (el) el.scrollIntoView(); } catch (e) {} }, 60);
  }
  addToCart(item) {
    let c = null;
    try { c = JSON.parse(localStorage.getItem('kovcheg-cart') || '[]'); } catch (e) { c = null; }
    if (c) {
      const f = c.find(x => x.id === item.id);
      if (f) f.qty += item.qty || 1; else c.push({ ...item, qty: item.qty || 1 });
      try { localStorage.setItem('kovcheg-cart', JSON.stringify(c)); } catch (e) {}
      this.setState({ cartCount: c.reduce((s, x) => s + x.qty, 0), toast: item.label });
    } else {
      this.setState({ cartCount: ((this.state && this.state.cartCount) || 0) + (item.qty || 1), toast: item.label });
    }
  }
  kit() {
    const s = this.state || {};
    return {
      demo: !!s.demo, isAnimal: s.demoKind === 'animal',
      demoTitle: s.demoKind === 'animal' ? 'Страница есть только у Алтая' : (s.demoWhat || 'Эта функция') + ' — только в настоящем сайте',
      demoText: s.demoKind === 'animal' ? 'В демо-версии сделана одна страница жителя — амурский тигр Алтай. Страницы остальных животных появятся в настоящем сайте. Хотите такой сайт — напишите мне в Telegram.' : '«Ковчег» — демо-проект для портфолио, зоопарк вымышленный, поэтому оплата, звонки и отправка форм здесь не работают. Хотите такой же сайт для своего бизнеса — напишите мне в Telegram, обсудим.',
      cartCount: s.cartCount || 0, hasCart: (s.cartCount || 0) > 0,
      toastOn: !!s.toast, toast: s.toast || '',
      closeToast: () => this.setState({ toast: '' }),
      callDemo: () => this.setState({ demo: true, demoKind: '', demoWhat: 'Звонок' }),
      mailDemo: () => this.setState({ demo: true, demoKind: '', demoWhat: 'Письмо' }),
      payDemo: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ demo: true, demoKind: '', demoWhat: 'Оплата' }); },
      formDemo: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ demo: true, demoKind: '', demoWhat: 'Отправка формы' }); },
      animalDemo: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ demo: true, demoKind: 'animal' }); },
      closeDemo: () => this.setState({ demo: false })
    };
  }
  componentDidMount() { this.kitInit(); }
  renderVals() {
    const scen = [
      { t: 'Семья с малышом до 5 лет', r: 'Ферма, Австралия, Пуща, обед и сон в коляске', w: 'будни, к 10:00', b: 'семейный 55 Br, до 6 лет — бесплатно', tip: 'Возьмите сменную одежду. Детское меню — в кафе у входа.' },
      { t: 'Семья со школьниками', r: 'Классика на 2,5 часа и кормление жирафов', w: 'выходные, к 12:00', b: 'семейный 70 Br', tip: 'Бинокли и лист «Найди всех жителей» — у кассы.' },
      { t: 'Пара', r: 'Тропики и ужин в павильоне «Саванна»', w: 'летом после 17:00', b: 'вечерний, 14 Br', tip: 'Столик у окна лучше забронировать.' },
      { t: 'Компания друзей', r: 'Азия, Саванна, электромобиль, пикник', w: 'выходные днём', b: 'от 10 человек — минус 20%', tip: 'Пикник-зона «Поляна» бесплатна.' },
      { t: 'Фотограф', r: 'Полный круг с открытия', w: 'утро в будни, час до закрытия', b: 'абонемент 120 Br', tip: 'Штативы, дроны и вспышка запрещены.' },
      { t: 'Пожилые и маломобильные', r: 'Экспресс на электромобиле', w: 'будние утра', b: 'пенсионерам 14 Br, I–II группа — бесплатно', tip: 'Скамейки каждые 100 м.' }
    ];
    return { ...this.kit(),  scen };
  }
}
</script>
