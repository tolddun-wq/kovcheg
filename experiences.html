<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ковчег — впечатления</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="img/favicon.svg">
<script src="js/kovcheg.js"></script>
</head>
<body>
<template id="x-dc">
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&amp;family=Oranienbaum&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F8F3}
a{color:inherit}
.k{font-family:'Jost',system-ui,sans-serif;color:#0E1F18;background:#F7F8F3;font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
.k *{box-sizing:border-box}
.wrap{max-width:1360px;margin:0 auto;padding:0 40px;position:relative}
.d{font-family:'Oranienbaum',serif;font-weight:400;line-height:.95;margin:0}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:92px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#12392B}
.logo svg{width:46px;height:46px}
.logo b{font-family:'Oranienbaum',serif;font-weight:400;font-size:34px;line-height:1}
.logo small{display:block;font-size:13px;color:#4F6157;margin-top:2px}
.nav{display:flex;gap:28px;flex-wrap:wrap}
.nav a{text-decoration:none;font-size:16px;font-weight:500;padding:10px 0}
.nav a:hover{color:#C4502E}
.nav a.on{box-shadow:inset 0 -2px 0 #C4502E}
.tk{-webkit-mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat}
.gr{position:relative;overflow:hidden;background:#12392B}
.gr img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.78) contrast(1.06) brightness(.98) sepia(.14)}
.gr::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(242,179,61,.12) 0%,rgba(18,57,43,.22) 100%);mix-blend-mode:multiply}
.lbl2{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:600;color:#C4502E;margin-top:20px}
.lbl2::before{content:'';width:44px;height:2px;background:currentColor;flex:none}

.top{position:relative;height:640px;color:#F7F8F3}
.top .gr{position:absolute;inset:0}
.top .gr img{object-position:50% 35%}
.top .shade{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(11,42,31,.9) 0%,rgba(11,42,31,.4) 55%,rgba(11,42,31,.1) 100%)}
.top .txt{position:absolute;left:0;right:0;bottom:56px;z-index:2}
.top h1{font-size:clamp(84px,10vw,150px)}
.top .lead{max-width:600px;font-size:20px;color:#DCE6DF;margin:20px 0 0}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:rgba(247,248,243,.12);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(247,248,243,.3);text-decoration:none;font-weight:600;font-size:16px;transition:background .2s}
.chip:hover{background:rgba(247,248,243,.24)}
.chip span{color:#F2B33D}

.xp{padding:110px 0}
.xp.alt{background:#E3EBE1}
.xp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:56px;align-items:start}
.xp.rev .xp-ph{order:2}
.xp-ph{height:620px;box-shadow:0 40px 60px -40px rgba(14,31,24,.6)}
.xp h2{font-size:clamp(52px,5.4vw,84px);color:#12392B;margin:12px 0 0}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
.meta span{padding:6px 14px;border-radius:999px;background:#fff;font-size:15px;font-weight:600;box-shadow:0 6px 12px -8px rgba(14,31,24,.5)}
.xp.alt .meta span{background:#F7F8F3}
.xp p{margin:0 0 16px;color:#3D4D44}
.inc{margin:6px 0 24px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:16px}
.inc li{display:flex;gap:10px}
.inc li::before{content:'';flex:none;width:8px;height:8px;margin-top:9px;border-radius:50%;background:#F2B33D;box-shadow:0 0 0 3px rgba(242,179,61,.25)}
.sched{background:#12392B;color:#F7F8F3;border-radius:6px;padding:8px 22px;margin:8px 0 24px}
.sched div{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;padding:10px 0;border-bottom:1px dashed rgba(247,248,243,.2);font-size:15px}
.sched div:last-child{border-bottom:0}
.sched b{font-family:'Oranienbaum',serif;font-weight:400;font-size:24px;line-height:1;color:#F2B33D}
.offers{display:flex;flex-direction:column;gap:12px;filter:drop-shadow(0 16px 18px rgba(14,31,24,.18))}
.offer{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;background:#fff;padding:18px 18px 18px 26px}
.offer b{display:block;font-size:18px;font-weight:600}
.offer span{font-size:14px;color:#4F6157}
.offer strong{font-family:'Oranienbaum',serif;font-weight:400;font-size:36px;color:#12392B;margin-right:6px}
.bk{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:999px;background:#F2B33D;color:#0E1F18;font-weight:600;font-size:15px;white-space:nowrap;transition:transform .2s}
.bk:hover{transform:translateY(-2px)}
.bk:focus-visible{outline:3px solid #12392B;outline-offset:2px}
.right{display:flex;align-items:center;gap:6px}
.rules{background:#12392B;color:#F7F8F3;padding:72px 0}
.rules .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:28px}
.rules .row div{padding:22px;border-radius:6px;background:#1C4A38}
.rules .row b{display:block;font-family:'Oranienbaum',serif;font-weight:400;font-size:40px;color:#F2B33D;line-height:1;margin-bottom:8px}

/* ——— shared kit ——— */
.k-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k-lnk{all:unset;box-sizing:border-box;cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;display:inline-flex;align-items:center;min-height:44px}
.k-lnk:hover{color:#C4502E}
.k-lnk:focus-visible,.k-cart:focus-visible,.k-buy:focus-visible,.k-x:focus-visible,.k-subbtn:focus-visible{outline:3px solid #F2B33D;outline-offset:3px}
.k-hr{display:flex;align-items:center;gap:18px}
.k-cart{position:relative;display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:#12392B;color:#F7F8F3;text-decoration:none;box-shadow:0 10px 18px -10px rgba(11,42,31,.7);transition:transform .2s}
.k-cart:hover{transform:translateY(-2px);color:#F7F8F3}
.k-cart svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.k-cart b{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#F2B33D;color:#0E1F18;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.k-buy{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:stretch;min-height:58px;color:#0E1F18;background:#F2B33D;font-family:'Jost',sans-serif;font-weight:600;font-size:17px;border-radius:8px;transition:transform .2s;
  -webkit-mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat}
.k-buy span{display:flex;align-items:center;padding:0 22px 0 28px}
.k-buy i{font-style:normal;display:flex;align-items:center;padding:0 26px 0 18px;border-left:2px dashed rgba(14,31,24,.35)}
.k-buy:hover{transform:translateY(-2px);color:#0E1F18}
.k-shadow{display:inline-block;filter:drop-shadow(0 12px 14px rgba(150,100,20,.35))}
.k-foot{background:#0B2A1F;color:#B7CBBE;padding:80px 0 36px;font-size:16px}
.k-foot .logo{color:#F7F8F3}.k-foot .logo small{color:#8FA898}
.k-foot-top{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:40px}
.k-faddr{margin:22px 0 0;line-height:1.6}
.k-faddr .k-lnk{min-height:0;color:#F7F8F3}
.k-foot h4{font-size:15px;font-weight:600;color:#F7F8F3;margin:0 0 14px}
.k-foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.k-foot ul a,.k-foot-bot a{text-decoration:none}.k-foot ul a:hover,.k-foot-bot a:hover{color:#F2B33D}
.k-sub{display:flex;gap:8px;margin-top:24px;max-width:460px}
.k-sub input{flex:1;min-width:0;height:50px;padding:0 16px;border-radius:6px;border:1.5px solid rgba(247,248,243,.3);background:rgba(247,248,243,.06);color:#F7F8F3;font:inherit}
.k-sub input::placeholder{color:#8FA898}
.k-subbtn{all:unset;box-sizing:border-box;cursor:pointer;height:50px;padding:0 20px;border-radius:6px;background:#F2B33D;color:#0E1F18;font-weight:600}
.k-foot-bot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:56px;padding-top:22px;border-top:1px solid rgba(247,248,243,.14);font-size:13px;color:#8FA898}
.k-credits{margin:14px 0 0;font-size:12px;line-height:1.6;color:#7E9587}
.k-veil{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(6,20,14,.62);backdrop-filter:blur(4px)}
.k-modal{position:relative;width:min(580px,100%);background:#12392B;color:#F7F8F3;border-radius:8px;border:6px solid #0F3123;padding:40px 38px 32px;box-shadow:0 2px 0 #0B2A1F,0 50px 90px -24px rgba(0,0,0,.75)}
.k-bolt{position:absolute;top:10px;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#EDE8DA,#8E8A7E)}
.k-mtag{display:inline-block;padding:4px 12px;border-radius:999px;background:#F2B33D;color:#0E1F18;font-size:13px;font-weight:600}
.k-mh{font-family:'Oranienbaum',serif;font-weight:400;font-size:44px;line-height:1;margin:16px 0 14px}
.k-mp{margin:0;color:#CFDDD3;font-size:17px;line-height:1.55}
.k-mrow{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:26px}
.k-back{color:#F7F8F3}
.k-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:55;display:flex;align-items:center;gap:16px;padding:12px 12px 12px 20px;border-radius:8px;background:#12392B;color:#F7F8F3;box-shadow:0 24px 40px -14px rgba(0,0,0,.6);font-size:15px;max-width:calc(100% - 32px)}
.k-toastgo{padding:10px 16px;border-radius:6px;background:#F2B33D;color:#0E1F18;font-weight:600;text-decoration:none;white-space:nowrap}
.k-x{all:unset;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#B7CBBE}
.k-field{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:600}
.k-field input,.k-field select,.k-field textarea{font:inherit;font-weight:400;font-size:17px;padding:13px 15px;border:1.5px solid #CBD5CD;border-radius:6px;background:#fff;color:#0E1F18}
.k-field textarea{min-height:120px;resize:vertical}
.k-field input:focus,.k-field select:focus,.k-field textarea:focus{outline:3px solid #F2B33D;outline-offset:1px;border-color:#12392B}
.k-check{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4}
.k-check input{width:20px;height:20px;margin:2px 0 0;accent-color:#12392B}
@media (max-width:1000px){
  .k-foot-top{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .k-foot-top>div:first-child{grid-column:1 / -1}
  .k-hr .k-lnk{display:none}
  .k-modal{padding:32px 20px 24px}
  .k-mh{font-size:34px}
  .k-toast{left:16px;right:16px;transform:none;flex-wrap:wrap}
}

@media (max-width:1000px){
  .wrap{padding:0 16px}
  .xp-grid,.rules .row{grid-template-columns:minmax(0,1fr)}
  .xp.rev .xp-ph{order:0}
  .xp-ph{height:320px}
  .xp{padding:64px 0}
  .top{height:620px}
  .offer{grid-template-columns:minmax(0,1fr);padding:18px}
  .nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:20px;scrollbar-width:none}.nav a{white-space:nowrap}
}
</style>
</helmet>

<div class="k">
  <header class="hdr"><div class="wrap">
    <a class="logo" href="index.html" aria-label="Ковчег, на главную">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M11.5 19 L20 11.5 L28.5 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></path><rect x="14.5" y="19" width="11" height="7" fill="none" stroke="currentColor" stroke-width="2.4"></rect><path d="M4 26 H36 L31 33 H9 Z" fill="currentColor"></path><path d="M5 37.5 q3.75 -2.5 7.5 0 t7.5 0 t7.5 0 t7.5 0" fill="none" stroke="#F2B33D" stroke-width="2" stroke-linecap="round"></path></svg>
      <span><b>Ковчег</b><small>зоопарк, Минск</small></span>
    </a>
    <nav class="nav" aria-label="Главное меню">
      <a href="animals.html">Животные</a>
      <a href="index.html#map">Карта</a>
      <a href="tickets.html">Билеты</a>
      <a class="on" aria-current="page" href="experiences.html">Впечатления</a>
      <a href="visit.html">Как добраться</a>
      <a href="about.html">О зоопарке</a>
    </nav>
    <div class="k-hr">
      <button class="k-lnk" type="button" onClick="{{callDemo}}">+375 17 000-00-00</button>
      <a class="k-cart" href="cart.html" aria-label="Корзина"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg><sc-if value="{{hasCart}}"><b>{{cartCount}}</b></sc-if></a>
    </div>
  </div></header>

  <section class="top">
    <div class="gr"><img src="img/lionyawn.jpg" alt="Лев зевает, видны клыки"></div>
    <div class="shade" aria-hidden="true"></div>
    <div class="txt"><div class="wrap">
      <h1 class="d">Больше, чем прогулка</h1>
      <p class="lead">Обычный билет — это вход в зоопарк. Если хочется увидеть, как живёт настоящий зоопарк, выберите одно из наших событий. Всё проходит только с нашими сотрудниками: безопасность животных и гостей — на первом месте.</p>
      <div class="chips">
        <a class="chip" href="#night">Ночь в зоопарке <span>от 85 Br</span></a>
        <a class="chip" href="#vip">За кулисами <span>180 Br</span></a>
        <a class="chip" href="#keeper">День зоолога <span>220 Br</span></a>
        <a class="chip" href="#school">Зоошкола <span>от 60 Br</span></a>
        <a class="chip" href="#birthday">День рождения <span>от 240 Br</span></a>
      </div>
    </div></div>
  </section>

  <section class="xp" id="night">
    <div class="wrap"><div class="xp-grid">
      <div class="gr xp-ph"><img src="img/tiger2.jpg" alt="Амурский тигр в вечерней траве"></div>
      <div>
        <div class="lbl2" style="margin-top:0">Ночь в зоопарке</div>
        <h2 class="d">Когда все уходят домой, зоопарк только начинается</h2>
        <div class="meta"><span>дети 7–14 лет с родителями</span><span>18:00 → 10:00</span><span>пт и сб, май–сентябрь</span><span>до 24 человек</span></div>
        <p>В пятницу или субботу вечером группа до 24 человек остаётся в парке, когда остальные гости уже ушли: ужин у саванны, ночной обход с фонариками, сон в палатках и завтрак с утренним кормлением жирафов.</p>
        <div class="sched">
          <div><b>18:00</b><span>встреча у входа, знакомство с зоологами, фонарики</span></div>
          <div><b>19:00</b><span>ужин: горячее, травяной чай, десерт</span></div>
          <div><b>20:30</b><span>вечерний рёв львов и кормление хищников</span></div>
          <div><b>22:00</b><span>ночной обход: совы, выдры, тасманийский дьявол</span></div>
          <div><b>23:30</b><span>отбой в палатках на площадке у Белорусской пущи</span></div>
          <div><b>8:00</b><span>подъём, завтрак, утреннее кормление жирафов</span></div>
          <div><b>10:00</b><span>завершение программы</span></div>
        </div>
        <p>Включено: палатка и коврик, ужин и завтрак, фонарик, билет в парк на следующий день. Спальник — свой. Бронь не позже чем за 3 дня.</p>
        <div class="offers">
          <div class="offer tk"><span><b>Взрослый</b>место в палатке</span><span class="right"><strong>95</strong><button class="bk" onClick="{{add.nightA}}">Забронировать</button></span></div>
          <div class="offer tk"><span><b>Детский, 7–14 лет</b>с родителем</span><span class="right"><strong>85</strong><button class="bk" onClick="{{add.nightC}}">Забронировать</button></span></div>
        </div>
      </div>
    </div></div>
  </section>

  <section class="xp alt rev" id="vip">
    <div class="wrap"><div class="xp-grid">
      <div class="gr xp-ph"><img src="img/pr-care.jpg" alt="Смотритель гладит галапагосскую черепаху"></div>
      <div>
        <div class="lbl2" style="margin-top:0">За кулисами · VIP-тур</div>
        <h2 class="d">Дверь «Только для сотрудников» открыта</h2>
        <div class="meta"><span>от 12 лет</span><span>3 часа</span><span>до 6 человек</span><span>вт, чт, сб в 10:00</span></div>
        <p>Кухня, где готовят рацион для 3 200 животных, ветеринарный центр и карантинный блок, тёплые помещения львов и слонов. Вы помогаете зоологу приготовить рацион и раздать его жирафам или оленям. Хищников — только через ограждение.</p>
        <ul class="inc"><li>билет в зоопарк на весь день</li><li>форма и перчатки</li><li>фото с жирафом</li><li>чай и пирог в столовой сотрудников</li></ul>
        <div class="offers"><div class="offer tk"><span><b>Место в группе</b>на одного человека</span><span class="right"><strong>180</strong><button class="bk" onClick="{{add.vip}}">Забронировать</button></span></div></div>
      </div>
    </div></div>
  </section>

  <section class="xp" id="keeper">
    <div class="wrap"><div class="xp-grid">
      <div class="gr xp-ph"><img src="img/pr-edu.jpg" alt="Смотрители кормят пингвинов"></div>
      <div>
        <div class="lbl2" style="margin-top:0">День зоолога</div>
        <h2 class="d">Работа, о которой мечтают с детства</h2>
        <div class="meta"><span>от 16 лет</span><span>8 часов</span><span>до 4 участников</span><span>по записи</span></div>
        <p>Восемь часов рядом с опытным зоологом на Ферме или в австралийской зоне: уборка вольеров, приготовление кормов, кормление, наблюдение и записи в журнал поведения.</p>
        <ul class="inc"><li>рабочая форма и обед</li><li>сертификат «Помощник зоолога»</li><li>нужна справка об отсутствии аллергии на шерсть и сено</li></ul>
        <div class="offers"><div class="offer tk"><span><b>Один участник</b>на весь день</span><span class="right"><strong>220</strong><button class="bk" onClick="{{add.keeper}}">Забронировать</button></span></div></div>
      </div>
    </div></div>
  </section>

  <section class="xp alt rev" id="school">
    <div class="wrap"><div class="xp-grid">
      <div class="gr xp-ph"><img src="img/goat.jpg" alt="Козлёнок крупным планом"></div>
      <div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":5400}}'>
class Component extends DCLogic {
  kitInit() {
    let n = 0;
    try { const c = JSON.parse(localStorage.getItem('kovcheg-cart') || '[]'); n = c.reduce((s, x) => s + (x.qty || 0), 0); } catch (e) {}
    this.setState({ cartCount: n });
    setTimeout(() => { try { const h = location.hash.slice(1); const el = h && document.getElementById(h); if (el) el.scrollIntoView(); } catch (e) {} }, 60);
  }
  addToCart(item) {
    let c = null;
    try { c = JSON.parse(localStorage.getItem('kovcheg-cart') || '[]'); } catch (e) { c = null; }
    if (c) {
      const f = c.find(x => x.id === item.id);
      if (f) f.qty += item.qty || 1; else c.push({ ...item, qty: item.qty || 1 });
      try { localStorage.setItem('kovcheg-cart', JSON.stringify(c)); } catch (e) {}
      this.setState({ cartCount: c.reduce((s, x) => s + x.qty, 0), toast: item.label });
    } else {
      this.setState({ cartCount: ((this.state && this.state.cartCount) || 0) + (item.qty || 1), toast: item.label });
    }
  }
  kit() {
    const s = this.state || {};
    return {
      demo: !!s.demo, isAnimal: s.demoKind === 'animal',
      demoTitle: s.demoKind === 'animal' ? 'Страница есть только у Алтая' : (s.demoWhat || 'Эта функция') + ' — только в настоящем сайте',
      demoText: s.demoKind === 'animal' ? 'В демо-версии сделана одна страница жителя — амурский тигр Алтай. Страницы остальных животных появятся в настоящем сайте. Хотите такой сайт — напишите мне в Telegram.' : '«Ковчег» — демо-проект для портфолио, зоопарк вымышленный, поэтому оплата, звонки и отправка форм здесь не работают. Хотите такой же сайт для своего бизнеса — напишите мне в Telegram, обсудим.',
      cartCount: s.cartCount || 0, hasCart: (s.cartCount || 0) > 0,
      toastOn: !!s.toast, toast: s.toast || '',
      closeToast: () => this.setState({ toast: '' }),
      callDemo: () => this.setState({ demo: true, demoKind: '', demoWhat: 'Звонок' }),
      mailDemo: () => this.setState({ demo: true, demoKind: '', demoWhat: 'Письмо' }),
      payDemo: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ demo: true, demoKind: '', demoWhat: 'Оплата' }); },
      formDemo: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ demo: true, demoKind: '', demoWhat: 'Отправка формы' }); },
      animalDemo: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ demo: true, demoKind: 'animal' }); },
      closeDemo: () => this.setState({ demo: false })
    };
  }
  componentDidMount() { this.kitInit(); }
  renderVals() {
    const a = (id, label, price) => () => this.addToCart({ id: 'xp-' + id, kind: 'Впечатление', label, price });
    return { ...this.kit(),
      add: {
        nightA: a('night-adult', 'Ночь в зоопарке · взрослый', 95),
        nightC: a('night-child', 'Ночь в зоопарке · детский', 85),
        vip: a('vip', 'За кулисами · VIP-тур', 180),
        keeper: a('keeper', 'День зоолога', 220),
        school: a('school', 'Зоошкола · 4 занятия', 60),
        camp: a('camp', 'Лагерь «Юный натуралист» · 5 дней', 280),
        bd1: a('bd-1', 'День рождения «Малыш»', 240),
        bd2: a('bd-2', 'День рождения «Исследователь»', 380),
        bd3: a('bd-3', 'День рождения «Сафари»', 560)
      }
    };
  }
}
</script>
