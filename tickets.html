<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ковчег — билеты</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="img/favicon.svg">
<script src="js/kovcheg.js"></script>
</head>
<body>
<template id="x-dc">
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&amp;family=Oranienbaum&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F8F3}
a{color:inherit}
.k{font-family:'Jost',system-ui,sans-serif;color:#0E1F18;background:#F7F8F3;font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
.k *{box-sizing:border-box}
.wrap{max-width:1360px;margin:0 auto;padding:0 40px;position:relative}
.d{font-family:'Oranienbaum',serif;font-weight:400;line-height:.95;margin:0}
.lnk{font-weight:600;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;display:inline-flex;align-items:center;min-height:44px}
.lnk:hover{color:#C4502E}
.tk{-webkit-mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat}
.buy{display:flex;align-items:stretch;min-height:58px;text-decoration:none;color:#0E1F18;background:#F2B33D;font-weight:600;font-size:17px;border-radius:8px;transition:transform .2s}
.buy span{flex:1;display:flex;align-items:center;justify-content:center;padding:0 22px}
.buy i{font-style:normal;display:flex;align-items:center;padding:0 26px 0 18px;border-left:2px dashed rgba(14,31,24,.35)}
.buy:hover{transform:translateY(-2px);color:#0E1F18}
.lbl2{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:600;color:#C4502E;margin-top:20px}
.lbl2::before{content:'';width:44px;height:2px;background:currentColor;flex:none}

.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:92px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#12392B}
.logo svg{width:46px;height:46px}
.logo b{font-family:'Oranienbaum',serif;font-weight:400;font-size:34px;line-height:1}
.logo small{display:block;font-size:13px;color:#4F6157;margin-top:2px}
.nav{display:flex;gap:28px;flex-wrap:wrap}
.nav a{text-decoration:none;font-size:16px;font-weight:500;padding:10px 0}
.nav a:hover{color:#C4502E}
.nav a.on{box-shadow:inset 0 -2px 0 #C4502E}

.top{padding:40px 0 100px;background:
  radial-gradient(300px 180px at 12% 30%,rgba(18,57,43,.06),transparent 70%),
  radial-gradient(260px 160px at 52% 10%,rgba(242,179,61,.16),transparent 70%),
  radial-gradient(420px 260px at 20% 90%,rgba(18,57,43,.08),transparent 70%),
  linear-gradient(180deg,#F7F8F3 0%,#E3EBE1 100%)}
.top-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:start}
.top h1{font-size:clamp(90px,11vw,170px);color:#12392B}
.top p{font-size:19px;color:#4F6157;max-width:520px;margin:28px 0 0}
.calc{position:relative;background:#12392B;color:#F7F8F3;padding:30px 32px 30px;border-radius:6px;border:6px solid #0F3123;transform:rotate(-.8deg);box-shadow:0 2px 0 #0B2A1F,0 40px 60px -28px rgba(11,42,31,.65),0 14px 22px -14px rgba(11,42,31,.45)}
.bolt{position:absolute;top:10px;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#EDE8DA,#8E8A7E);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.b1{left:10px}.b2{right:10px}
.calc h2{font-size:46px}
.seg{display:grid;grid-template-columns:1fr 1fr;margin:22px 0 6px;padding:4px;border-radius:999px;background:#0B2A1F}
.seg button{all:unset;box-sizing:border-box;min-height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;font-weight:600;border-radius:999px;color:#CFDDD3;transition:background .2s}
.seg button.on{background:#F7F8F3;color:#12392B;box-shadow:0 6px 12px -6px rgba(0,0,0,.6)}
.seg button:focus-visible,.step button:focus-visible{outline:3px solid #F2B33D;outline-offset:2px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px dashed rgba(247,248,243,.25)}
.line b{font-weight:600;display:block}
.line small{color:#B7CBBE;font-size:15px}
.step{display:flex;align-items:center;gap:6px}
.step button{all:unset;box-sizing:border-box;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px;border-radius:50%;background:#1C4A38;box-shadow:inset 0 0 0 1px rgba(247,248,243,.25);transition:background .2s}
.step button:hover{background:#F2B33D;color:#0E1F18}
.step output{min-width:44px;text-align:center;font-family:'Oranienbaum',serif;font-size:34px}
.opts{display:flex;flex-direction:column;gap:8px;margin:22px 0 16px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 18px;background:#1C4A38;border-radius:4px}
.opt span{font-size:15px;color:#DCE6DF}
.opt span b{display:block;font-size:13px;color:#B7CBBE;font-weight:600}
.opt strong{font-family:'Oranienbaum',serif;font-weight:400;font-size:32px}
.opt.best{background:#F2B33D;color:#0E1F18;box-shadow:0 12px 20px -10px rgba(0,0,0,.6)}
.opt.best span,.opt.best span b{color:#0E1F18}
.verdict{font-size:15px;color:#DCE6DF;margin:0 0 18px}
.stepn{margin:6px 0 0;font-size:15px;color:#B7CBBE}
.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:20px 0 8px}
.dayb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:6px;background:#1C4A38;box-shadow:inset 0 0 0 1px rgba(247,248,243,.18);transition:background .2s}
.dayb small{font-size:12px;color:#B7CBBE}
.dayb b{font-family:'Oranienbaum',serif;font-weight:400;font-size:30px;line-height:1.1}
.dayb:hover{background:#245a45}
.dayb.on{background:#F7F8F3;color:#12392B;box-shadow:0 8px 14px -8px rgba(0,0,0,.6)}
.dayb.on small{color:#4F6157}
.dayb.we small:first-child{color:#F2B33D}
.dayb.on.we small:first-child{color:#C4502E}
.dayb:focus-visible{outline:3px solid #F2B33D;outline-offset:2px}
.hint{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 0;padding:12px 14px;border-radius:4px;background:#1C4A38;font-size:15px;color:#F7F8F3}
.hintb{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;background:#F2B33D;color:#0E1F18;font-weight:600;font-size:14px;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 18px;padding-top:16px;border-top:2px dashed rgba(247,248,243,.25)}
.total span{font-size:16px;color:#CFDDD3}
.total strong{font-family:'Oranienbaum',serif;font-weight:400;font-size:52px;line-height:1;color:#F2B33D}
.passb{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin:0 24px 24px;min-height:46px;border-radius:999px;background:#12392B;color:#F7F8F3;font-weight:600;font-size:15px;transition:transform .2s}
.passb:hover{transform:translateY(-2px)}
.pass.gold .passb{background:#0E1F18}

.sec{padding:110px 0}
.h2{font-size:clamp(52px,5.4vw,88px);color:#12392B}
.prices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:40px;filter:drop-shadow(0 20px 22px rgba(14,31,24,.18))}
.ticket{display:grid;grid-template-columns:minmax(0,1fr) 120px;min-height:170px;background:#fff;transition:transform .2s}
.ticket:hover{transform:translateY(-3px) rotate(-.5deg)}
.ticket .m{padding:22px 22px;display:flex;flex-direction:column;gap:2px}
.ticket .m h3{margin:0 0 8px;font-size:20px;font-weight:600}
.ticket .m span{font-size:15px;color:#3D4D44}
.ticket .s{border-left:2px dashed #CBD5CD;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Oranienbaum',serif;font-size:50px;line-height:1;color:#12392B}
.ticket .s small{font-family:'Jost',sans-serif;font-size:13px;color:#4F6157;margin-top:6px}
.ticket.dark{background:#12392B;color:#F7F8F3}
.ticket.dark .m span{color:#CFDDD3}
.ticket.dark .s{color:#F2B33D;border-color:rgba(247,248,243,.3)}
.ticket.dark .s small{color:#B7CBBE}
.note{color:#4F6157;font-size:16px;margin-top:20px}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px}
.list{background:#fff;padding:6px 26px;margin-top:28px;box-shadow:0 1px 0 rgba(14,31,24,.06),0 30px 50px -38px rgba(14,31,24,.55)}
.list div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;padding:16px 0;border-bottom:1px solid rgba(14,31,24,.1);font-size:16px}
.list div:last-child{border-bottom:0}
.list div span:first-child{font-weight:600}
.list div span:last-child{color:#3D4D44}

.passes{background:#12392B;color:#F7F8F3}
.passes .h2{color:#F7F8F3}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:44px;filter:drop-shadow(0 22px 26px rgba(0,0,0,.4))}
.pass{display:flex;flex-direction:column;background:#F7F8F3;color:#0E1F18;min-height:360px}
.pass .t{padding:24px 24px 12px}
.pass .t small{font-size:14px;color:#4F6157;font-weight:600}
.pass .t h3{margin:6px 0 0;font-size:22px}
.pass .p{padding:0 24px;font-family:'Oranienbaum',serif;font-size:66px;line-height:1;color:#12392B}
.pass .p span{font-size:26px}
.pass .x{margin-top:auto;padding:18px 24px 24px;border-top:2px dashed #CBD5CD;font-size:15px;color:#3D4D44}
.pass.gold{background:#F2B33D}
.pass.gold .x{border-color:rgba(14,31,24,.25);color:#0E1F18}

.extras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:40px}
.ex{background:#fff;padding:22px 20px;box-shadow:0 1px 0 rgba(14,31,24,.06),0 20px 34px -28px rgba(14,31,24,.5);transition:transform .2s}
.ex:hover{transform:translateY(-3px)}
.ex b{display:block;font-family:'Oranienbaum',serif;font-weight:400;font-size:38px;line-height:1;color:#12392B;margin-bottom:8px}
.ex span{font-size:15px;color:#3D4D44}

.gr{position:relative;overflow:hidden;background:#12392B}
.gr img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.78) contrast(1.06) brightness(.98) sepia(.14)}
.gr::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(242,179,61,.12) 0%,rgba(18,57,43,.22) 100%);mix-blend-mode:multiply}
.menu{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;align-items:stretch}
.menu-ph{position:relative;min-height:640px}
.menu-ph .gr{position:absolute;inset:0;box-shadow:0 40px 60px -40px rgba(14,31,24,.6)}
.menu-ph .gr img{object-position:70% 40%}
.menu-cap{position:absolute;left:22px;bottom:22px;z-index:2;max-width:420px;padding:10px 14px;border-radius:4px;background:rgba(11,42,31,.7);backdrop-filter:blur(6px);color:#F7F8F3;font-size:15px}
.board{position:relative;margin:48px 0 48px -60px;z-index:2;background:#12392B;color:#F7F8F3;padding:34px 36px 28px;border-radius:6px;border:6px solid #0F3123;transform:rotate(-.8deg);box-shadow:0 2px 0 #0B2A1F,0 44px 64px -28px rgba(11,42,31,.7),0 16px 24px -14px rgba(11,42,31,.5);transition:transform .4s}
.board:hover{transform:rotate(0)}
.board h2{font-size:56px}
.bsub{margin:6px 0 18px;font-size:15px;color:#B7CBBE}
.mrow{display:flex;align-items:baseline;gap:10px;padding:9px 0;font-size:17px}
.mrow i{flex:1;border-bottom:2px dotted rgba(247,248,243,.35);transform:translateY(-5px)}
.mrow b{font-family:'Oranienbaum',serif;font-weight:400;font-size:30px;color:#F2B33D;white-space:nowrap}
.mrow.free b{font-family:'Jost',sans-serif;font-size:17px;font-weight:600;color:#9BE08A}
.how{background:#E3EBE1}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:44px}
.stp{background:#fff;padding:28px;box-shadow:0 1px 0 rgba(14,31,24,.06),0 26px 40px -30px rgba(14,31,24,.5)}
.stp b{display:block;font-family:'Oranienbaum',serif;font-weight:400;font-size:64px;line-height:1;color:#C4502E}
.stp h3{margin:12px 0 6px;font-size:21px}
.stp p{margin:0;color:#3D4D44;font-size:16px}
.foot{background:#0B2A1F;color:#B7CBBE;padding:56px 0 36px;font-size:15px}
.foot .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
.foot .logo{color:#F7F8F3}.foot .logo small{color:#8FA898}
@media (max-width:1000px){
  .wrap{padding:0 16px}
  .top-grid,.two,.steps,.prices{grid-template-columns:minmax(0,1fr)}
  .pgrid,.extras{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sec{padding:72px 0}
  .calc{padding:22px 18px;transform:none}
  .menu{grid-template-columns:minmax(0,1fr)}
  .menu-ph{min-height:320px}
  .board{margin:-40px 0 0;padding:24px 18px;transform:none}
  .nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:20px;scrollbar-width:none}.nav a{white-space:nowrap}
}

/* ——— shared kit ——— */
.k-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k-lnk{all:unset;box-sizing:border-box;cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;display:inline-flex;align-items:center;min-height:44px}
.k-lnk:hover{color:#C4502E}
.k-lnk:focus-visible,.k-cart:focus-visible,.k-buy:focus-visible,.k-x:focus-visible,.k-subbtn:focus-visible{outline:3px solid #F2B33D;outline-offset:3px}
.k-hr{display:flex;align-items:center;gap:18px}
.k-cart{position:relative;display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:#12392B;color:#F7F8F3;text-decoration:none;box-shadow:0 10px 18px -10px rgba(11,42,31,.7);transition:transform .2s}
.k-cart:hover{transform:translateY(-2px);color:#F7F8F3}
.k-cart svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.k-cart b{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#F2B33D;color:#0E1F18;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.k-buy{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:stretch;min-height:58px;color:#0E1F18;background:#F2B33D;font-family:'Jost',sans-serif;font-weight:600;font-size:17px;border-radius:8px;transition:transform .2s;
  -webkit-mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat}
.k-buy span{display:flex;align-items:center;padding:0 22px 0 28px}
.k-buy i{font-style:normal;display:flex;align-items:center;padding:0 26px 0 18px;border-left:2px dashed rgba(14,31,24,.35)}
.k-buy:hover{transform:translateY(-2px);color:#0E1F18}
.k-shadow{display:inline-block;filter:drop-shadow(0 12px 14px rgba(150,100,20,.35))}
.k-foot{background:#0B2A1F;color:#B7CBBE;padding:80px 0 36px;font-size:16px}
.k-foot .logo{color:#F7F8F3}.k-foot .logo small{color:#8FA898}
.k-foot-top{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:40px}
.k-faddr{margin:22px 0 0;line-height:1.6}
.k-faddr .k-lnk{min-height:0;color:#F7F8F3}
.k-foot h4{font-size:15px;font-weight:600;color:#F7F8F3;margin:0 0 14px}
.k-foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.k-foot ul a,.k-foot-bot a{text-decoration:none}.k-foot ul a:hover,.k-foot-bot a:hover{color:#F2B33D}
.k-sub{display:flex;gap:8px;margin-top:24px;max-width:460px}
.k-sub input{flex:1;min-width:0;height:50px;padding:0 16px;border-radius:6px;border:1.5px solid rgba(247,248,243,.3);background:rgba(247,248,243,.06);color:#F7F8F3;font:inherit}
.k-sub input::placeholder{color:#8FA898}
.k-subbtn{all:unset;box-sizing:border-box;cursor:pointer;height:50px;padding:0 20px;border-radius:6px;background:#F2B33D;color:#0E1F18;font-weight:600}
.k-foot-bot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:56px;padding-top:22px;border-top:1px solid rgba(247,248,243,.14);font-size:13px;color:#8FA898}
.k-credits{margin:14px 0 0;font-size:12px;line-height:1.6;color:#7E9587}
.k-veil{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(6,20,14,.62);backdrop-filter:blur(4px)}
.k-modal{position:relative;width:min(580px,100%);background:#12392B;color:#F7F8F3;border-radius:8px;border:6px solid #0F3123;padding:40px 38px 32px;box-shadow:0 2px 0 #0B2A1F,0 50px 90px -24px rgba(0,0,0,.75)}
.k-bolt{position:absolute;top:10px;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#EDE8DA,#8E8A7E)}
.k-mtag{display:inline-block;padding:4px 12px;border-radius:999px;background:#F2B33D;color:#0E1F18;font-size:13px;font-weight:600}
.k-mh{font-family:'Oranienbaum',serif;font-weight:400;font-size:44px;line-height:1;margin:16px 0 14px}
.k-mp{margin:0;color:#CFDDD3;font-size:17px;line-height:1.55}
.k-mrow{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:26px}
.k-back{color:#F7F8F3}
.k-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:55;display:flex;align-items:center;gap:16px;padding:12px 12px 12px 20px;border-radius:8px;background:#12392B;color:#F7F8F3;box-shadow:0 24px 40px -14px rgba(0,0,0,.6);font-size:15px;max-width:calc(100% - 32px)}
.k-toastgo{padding:10px 16px;border-radius:6px;background:#F2B33D;color:#0E1F18;font-weight:600;text-decoration:none;white-space:nowrap}
.k-x{all:unset;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#B7CBBE}
.k-field{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:600}
.k-field input,.k-field select,.k-field textarea{font:inherit;font-weight:400;font-size:17px;padding:13px 15px;border:1.5px solid #CBD5CD;border-radius:6px;background:#fff;color:#0E1F18}
.k-field textarea{min-height:120px;resize:vertical}
.k-field input:focus,.k-field select:focus,.k-field textarea:focus{outline:3px solid #F2B33D;outline-offset:1px;border-color:#12392B}
.k-check{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4}
.k-check input{width:20px;height:20px;margin:2px 0 0;accent-color:#12392B}
@media (max-width:1000px){
  .k-foot-top{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .k-foot-top>div:first-child{grid-column:1 / -1}
  .k-hr .k-lnk{display:none}
  .k-modal{padding:32px 20px 24px}
  .k-mh{font-size:34px}
  .k-toast{left:16px;right:16px;transform:none;flex-wrap:wrap}
}

</style>
</helmet>

<div class="k">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4800}}'>
class Component extends DCLogic {
  kitInit() {
    let n = 0;
    try { const c = JSON.parse(localStorage.getItem('kovcheg-cart') || '[]'); n = c.reduce((s, x) => s + (x.qty || 0), 0); } catch (e) {}
    this.setState({ cartCount: n });
    setTimeout(() => { try { const h = location.hash.slice(1); const el = h && document.getElementById(h); if (el) el.scrollIntoView(); } catch (e) {} }, 60);
  }
  addToCart(item) {
    let c = null;
    try { c = JSON.parse(localStorage.getItem('kovcheg-cart') || '[]'); } catch (e) { c = null; }
    if (c) {
      const f = c.find(x => x.id === item.id);
      if (f) f.qty += item.qty || 1; else c.push({ ...item, qty: item.qty || 1 });
      try { localStorage.setItem('kovcheg-cart', JSON.stringify(c)); } catch (e) {}
      this.setState({ cartCount: c.reduce((s, x) => s + x.qty, 0), toast: item.label });
    } else {
      this.setState({ cartCount: ((this.state && this.state.cartCount) || 0) + (item.qty || 1), toast: item.label });
    }
  }
  kit() {
    const s = this.state || {};
    return {
      demo: !!s.demo, isAnimal: s.demoKind === 'animal',
      demoTitle: s.demoKind === 'animal' ? 'Страница есть только у Алтая' : (s.demoWhat || 'Эта функция') + ' — только в настоящем сайте',
      demoText: s.demoKind === 'animal' ? 'В демо-версии сделана одна страница жителя — амурский тигр Алтай. Страницы остальных животных появятся в настоящем сайте. Хотите такой сайт — напишите мне в Telegram.' : '«Ковчег» — демо-проект для портфолио, зоопарк вымышленный, поэтому оплата, звонки и отправка форм здесь не работают. Хотите такой же сайт для своего бизнеса — напишите мне в Telegram, обсудим.',
      cartCount: s.cartCount || 0, hasCart: (s.cartCount || 0) > 0,
      toastOn: !!s.toast, toast: s.toast || '',
      closeToast: () => this.setState({ toast: '' }),
      callDemo: () => this.setState({ demo: true, demoKind: '', demoWhat: 'Звонок' }),
      mailDemo: () => this.setState({ demo: true, demoKind: '', demoWhat: 'Письмо' }),
      payDemo: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ demo: true, demoKind: '', demoWhat: 'Оплата' }); },
      formDemo: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ demo: true, demoKind: '', demoWhat: 'Отправка формы' }); },
      animalDemo: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ demo: true, demoKind: 'animal' }); },
      closeDemo: () => this.setState({ demo: false })
    };
  }
  componentDidMount() { this.kitInit(); }
  constructor(props) { super(props); this.state = { day: 1, q: { adult: 2, child: 1, student: 0, family: 0, small: 0 } }; }
  renderVals() {
    // six days starting today; Saturday and Sunday use weekend prices
    const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
    const MO = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
    const t0 = new Date(); t0.setHours(12, 0, 0, 0);
    const DAYS = [0, 1, 2, 3, 4, 5].map(i => {
      const d = new Date(t0.getTime() + i * 864e5);
      const p = n => String(n).padStart(2, '0');
      return { wd: WD[d.getDay()], num: d.getDate(), mon: MO[d.getMonth()], iso: d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()), we: d.getDay() === 0 || d.getDay() === 6, today: i === 0 };
    });
    const di = this.state.day, D = DAYS[di], we = D.we, q = this.state.q;
    const TYPES = [
      { key: 'adult', label: 'Взрослый', note: 'от 18 лет', price: we ? 28 : 22 },
      { key: 'child', label: 'Детский', note: '6–17 лет', price: we ? 14 : 11 },
      { key: 'student', label: 'Студент, пенсионер', note: 'по документу', price: we ? 17 : 14 },
      { key: 'family', label: 'Семейный', note: '2 взрослых + до 3 детей', price: we ? 70 : 55 },
      { key: 'small', label: 'Ребёнок до 6 лет', note: 'со взрослым', price: 0 }
    ];
    const setQ = (key, v) => this.setState({ q: { ...q, [key]: Math.max(0, Math.min(10, v)) } });
    const rows = TYPES.map(t => ({ ...t, qty: q[t.key], priceText: t.price ? t.price + ' Br' : 'бесплатно', inc: () => setQ(t.key, q[t.key] + 1), dec: () => setQ(t.key, q[t.key] - 1) }));
    const total = TYPES.reduce((s, t) => s + t.price * q[t.key], 0);
    const count = TYPES.reduce((s, t) => s + q[t.key], 0);
    const A = TYPES[0].price, K = TYPES[1].price, F = TYPES[3].price;
    const kids = Math.min(q.child, 3), save = 2 * A + kids * K - F;
    const showHint = q.adult >= 2 && q.child >= 1 && save > 0;
    const dayLabel = (we ? '' : '') + D.wd + ' ' + D.num + ' ' + D.mon + (D.today ? ', сегодня' : '');
    const order = () => {
      let c = [];
      try { c = JSON.parse(localStorage.getItem('kovcheg-cart') || '[]'); } catch (e) { c = null; }
      if (!c) return;
      TYPES.forEach(t => {
        if (!q[t.key]) return;
        const id = 'ticket-' + t.key + '-' + D.iso;
        const f = c.find(x => x.id === id);
        if (f) f.qty += q[t.key];
        else c.push({ id, kind: 'Билет', label: t.label + ' · ' + dayLabel, price: t.price, qty: q[t.key] });
      });
      try { localStorage.setItem('kovcheg-cart', JSON.stringify(c)); } catch (e) {}
    };
    const pass = (id, label, price) => () => this.addToCart({ id: 'pass-' + id, kind: 'Абонемент', label, price });
    const cw = count % 10 === 1 && count % 100 !== 11 ? 'билет' : ([2, 3, 4].includes(count % 10) && ![12, 13, 14].includes(count % 100) ? 'билета' : 'билетов');
    return { ...this.kit(),
      days: DAYS.map((d, i) => ({ ...d, cls: (i === di ? 'on ' : '') + (d.we ? 'we' : ''), pressed: i === di ? 'true' : 'false', pick: () => this.setState({ day: i }) })),
      rows, total, count, countWord: cw, totalTxt: total + ' Br', countTxt: 'Итого за ' + count + ' ' + cw, canOrder: count > 0, noOrder: count === 0, order,
      showHint, hint: 'Семейный билет выйдет на ' + save + ' Br дешевле, чем отдельные билеты.',
      useFamily: () => this.setState({ q: { ...q, adult: q.adult - 2, child: q.child - kids, family: q.family + 1 } }),
      pa: { adult: pass('adult', 'Абонемент «Путешественник», взрослый', 120), child: pass('child', 'Абонемент «Путешественник», 6–17 лет', 60), family: pass('family', 'Абонемент «Семья Ковчега»', 280), friend: pass('friend', 'Абонемент «Друг Ковчега»', 450) }
    };
  }
}
</script>
