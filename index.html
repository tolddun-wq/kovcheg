<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ковчег — главная</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="img/favicon.svg">
<script src="js/kovcheg.js"></script>
</head>
<body>
<template id="x-dc">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&amp;family=Oranienbaum&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F8F3}
a{color:inherit}
.k{font-family:'Jost',system-ui,sans-serif;color:#0E1F18;background:#F7F8F3;font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
.k *{box-sizing:border-box}
.wrap{max-width:1360px;margin:0 auto;padding:0 40px;position:relative}
.d{font-family:'Oranienbaum',serif;font-weight:400;line-height:.95;margin:0;letter-spacing:-.005em}

/* one signature: the ticket */
.tk{position:relative;border-radius:8px;
  -webkit-mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat}
.tk-v{-webkit-mask:radial-gradient(circle 12px at 50% 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 12px at 50% 100%,#0000 97%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 12px at 50% 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 12px at 50% 100%,#0000 97%,#000) bottom/100% 51% no-repeat}
.perf{border:0;border-top:2px dashed currentColor;opacity:.3;margin:0}
.buy{display:inline-flex;align-items:stretch;min-height:58px;text-decoration:none;color:#0E1F18;background:#F2B33D;font-weight:600;font-size:17px;transition:transform .2s}
.buy span{display:flex;align-items:center;padding:0 22px 0 28px}
.buy i{font-style:normal;display:flex;align-items:center;padding:0 26px 0 18px;border-left:2px dashed rgba(14,31,24,.35)}
.buy:hover{transform:translateY(-2px);color:#0E1F18}
.lnk{font-weight:600;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;display:inline-flex;align-items:center;min-height:44px}
.lnk:hover{color:#C4502E}

/* one photo treatment for every picture */
.gr{position:relative;overflow:hidden;background:#12392B}
.gr img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.78) contrast(1.06) brightness(.98) sepia(.14)}
.gr::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(242,179,61,.12) 0%,rgba(18,57,43,.22) 100%);mix-blend-mode:multiply}
.gr::before{display:none}

/* header */
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:92px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#12392B}
.logo svg{width:46px;height:46px}
.logo b{font-family:'Oranienbaum',serif;font-weight:400;font-size:34px;line-height:1}
.logo small{display:block;font-size:13px;color:#4F6157;margin-top:2px}
.nav{display:flex;gap:28px;flex-wrap:wrap}
.nav a{text-decoration:none;font-size:16px;font-weight:500;padding:10px 0}
.nav a:hover{color:#C4502E}

/* hero: today first */
.hero{position:relative;padding:24px 0 0;background:
  radial-gradient(300px 180px at 10% 28%,rgba(18,57,43,.06),transparent 70%),
  radial-gradient(360px 220px at 44% 78%,rgba(18,57,43,.06),transparent 70%),
  radial-gradient(260px 160px at 70% 10%,rgba(242,179,61,.16),transparent 70%),
  radial-gradient(200px 140px at 30% 8%,rgba(242,179,61,.10),transparent 70%),
  radial-gradient(420px 260px at 92% 86%,rgba(18,57,43,.08),transparent 70%),
  linear-gradient(180deg,#F7F8F3 0%,#EEF2E8 55%,#DFE8DC 100%)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:56px;align-items:end}
.hero-grid>div:first-child{padding-bottom:72px}
.cta{filter:drop-shadow(0 12px 14px rgba(150,100,20,.35))}
/* the "today" board on a wooden post */
.post{position:relative;display:flex;flex-direction:column;align-items:center}
.post .today{position:relative;z-index:2;width:100%;transform:rotate(-1.2deg);border-radius:6px;border:6px solid #0F3123;box-shadow:0 2px 0 #0B2A1F,0 36px 50px -24px rgba(11,42,31,.6),0 14px 22px -14px rgba(11,42,31,.45);transition:transform .4s}
.post .today:hover{transform:rotate(0deg)}
.bolt{position:absolute;top:10px;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#EDE8DA,#8E8A7E);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.b1{left:10px}.b2{right:10px}
.pole{width:30px;height:130px;margin-top:-14px;z-index:1;background:linear-gradient(90deg,#5A3F2A 0%,#8A6545 45%,#6E4E34 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),10px 0 18px -6px rgba(11,42,31,.35)}
.ground{width:240px;height:26px;margin-top:-13px;border-radius:50%;background:radial-gradient(closest-side,rgba(11,42,31,.38),transparent)}
.hero h1{font-size:clamp(60px,7vw,112px);color:#12392B}
.hero h1 .h1s{display:flex;align-items:center;gap:14px;font-family:'Jost',sans-serif;font-size:22px;font-weight:600;letter-spacing:.01em;line-height:1.2;color:#C4502E;margin-top:22px}
.hero h1 .h1s::before{content:'';width:44px;height:2px;background:currentColor;flex:none}
.hero .sub{font-size:19px !important;color:#4F6157 !important;margin:20px 0 32px !important}
.hero .sub{font-size:21px;margin:26px 0 34px;max-width:620px;color:#3D4D44}
.today{background:#12392B;color:#F7F8F3;padding:28px 34px 26px}
.today .when{font-size:15px;color:#B7CBBE}
.today .open{font-family:'Oranienbaum',serif;font-size:58px;line-height:1;margin:8px 0 4px}
.today .row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:baseline;padding:14px 0 0}
.today .row b{font-family:'Oranienbaum',serif;font-weight:400;font-size:30px;color:#F2B33D}
.today p{margin:0;font-size:16px;color:#DCE6DF}
.today .perf{margin:18px -34px 0;color:#F7F8F3}
.place{height:560px;margin-top:8px}
.cap{position:absolute;left:24px;bottom:20px;z-index:2;font-size:15px;color:#F7F8F3;max-width:560px;padding:10px 14px;border-radius:4px;background:rgba(11,42,31,.62);backdrop-filter:blur(6px)}
.place{box-shadow:inset 0 18px 24px -18px rgba(11,42,31,.5)}

/* map */
.map-sec{background:#12392B;color:#F7F8F3;padding:110px 0 120px}
.map-head{display:flex;justify-content:space-between;align-items:end;gap:32px;flex-wrap:wrap;margin-bottom:44px}
.map-head h2{font-size:clamp(52px,5.6vw,88px)}
.map-head p{margin:0;max-width:440px;color:#CFDDD3}
.map-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px}
.map{position:relative;height:640px;border-radius:28px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(247,248,243,.08),0 50px 70px -40px rgba(0,0,0,.75);background:
  radial-gradient(90px 70px at 7% 12%,#2E6B4E 0 58%,transparent 62%),
  radial-gradient(70px 56px at 15% 20%,#285F45 0 58%,transparent 62%),
  radial-gradient(110px 80px at 93% 90%,#2E6B4E 0 58%,transparent 62%),
  radial-gradient(84px 66px at 86% 10%,#285F45 0 58%,transparent 62%),
  radial-gradient(64px 50px at 4% 90%,#285F45 0 58%,transparent 62%),
  radial-gradient(130px 96px at 48% 52%,#23573E 0 58%,transparent 62%),
  radial-gradient(60px 46px at 72% 52%,#285F45 0 58%,transparent 62%),
  radial-gradient(70px 50px at 28% 46%,#285F45 0 58%,transparent 62%),
  #1C4A38}
.map svg.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.map .lake,.map .gate{pointer-events:none}
.lake{position:absolute;left:2%;top:54%;width:96px;height:64px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#8CC3D9,#4F8FAA);box-shadow:inset 0 4px 10px rgba(0,0,0,.25),0 0 0 3px rgba(247,248,243,.12)}
.lake span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;font-weight:600;color:#0B2A1F}
.am{all:unset;box-sizing:border-box;position:absolute;transform:translate(-50%,-50%);z-index:4;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#F7F8F3;cursor:pointer;box-shadow:0 10px 18px -6px rgba(0,0,0,.6);transition:transform .2s}
.am:hover,.am:focus{transform:translate(-50%,-50%) scale(1.12);z-index:6}
.am:focus-visible{outline:3px solid #F2B33D;outline-offset:3px}
.am .lbl{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translate(-50%,6px);padding:8px 12px;border-radius:6px;background:#F7F8F3;color:#12392B;font-family:'Jost',sans-serif;font-size:15px;font-weight:600;line-height:1.25;white-space:nowrap;text-align:left;box-shadow:0 14px 24px -8px rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s}
.am .lbl small{display:block;font-size:13px;font-weight:500;color:#4F6157}
.am:hover .lbl,.am:focus .lbl{opacity:1;transform:translate(-50%,0)}
.am svg{width:18px;height:18px;fill:none;stroke:#C4502E;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.am.car{background:#F2B33D;color:#0E1F18}.am.car svg{stroke:#0E1F18}
.map-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:14px;color:#CFDDD3}
.map-legend span{display:inline-flex;align-items:center;gap:8px}
.map-legend i{display:inline-block;width:26px;height:6px;border-radius:3px}
.pin{all:unset;box-sizing:border-box;position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
.map .pin{z-index:5;pointer-events:auto}
.pin .c{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Oranienbaum',serif;font-size:25px;color:#0E1F18;box-shadow:0 0 0 4px #1C4A38,0 0 0 5px rgba(247,248,243,.35),0 14px 20px -6px rgba(0,0,0,.65);transition:transform .2s, box-shadow .2s}
.pin .t{font-size:15px;font-weight:600;color:#F7F8F3;white-space:nowrap;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.pin:hover .c{transform:scale(1.08) translateY(-2px)}
.pin.on .c{transform:scale(1.18);box-shadow:0 0 0 4px #1C4A38,0 0 0 7px #F7F8F3,0 18px 26px -6px rgba(0,0,0,.7)}
.pin:focus-visible .c{outline:3px solid #F2B33D;outline-offset:4px}
.gate{position:absolute;transform:translate(-50%,-50%);padding:6px 12px;border-radius:4px;background:#F7F8F3;color:#12392B;font-size:14px;font-weight:600}
.zone{background:#F7F8F3;color:#0E1F18;display:flex;flex-direction:column;box-shadow:0 50px 70px -40px rgba(0,0,0,.75)}
.zone .gr{height:300px}
.zone .gr img{object-position:50% 22%}
.zone .zb{padding:26px 30px 30px;display:flex;flex-direction:column;gap:12px}
.zone h3{font-size:56px;color:#12392B}
.zone .mot{font-size:19px;font-weight:600;margin:0}
.zone .facts{display:flex;gap:28px;flex-wrap:wrap;font-size:15px;color:#3D4D44}
.zone .facts b{display:block;font-family:'Oranienbaum',serif;font-weight:400;font-size:30px;color:#0E1F18;line-height:1}
.zone p{margin:0;color:#3D4D44;font-size:16px}

/* feedings as stubs */
.feed{padding:96px 0 72px;background:#E3EBE1}
.feed-head{display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap}
.feed-head h2{font-size:clamp(44px,4.6vw,72px);color:#12392B}
.stubs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:28px 2px 30px;filter:drop-shadow(0 1px 0 rgba(14,31,24,.18)) drop-shadow(0 14px 16px rgba(14,31,24,.22));scrollbar-width:thin;scrollbar-color:#12392B transparent}
.stub{min-height:150px;background:#fff;padding:20px 18px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 0 rgba(14,31,24,.08)}
.stub b{font-family:'Oranienbaum',serif;font-weight:400;font-size:40px;line-height:1;color:#12392B}
.stub span{font-size:15px;line-height:1.3}
.stub small{font-size:13px;color:#4F6157;margin-top:auto}
.stub.past{background:#F1F4EF}
.stub.past b,.stub.past span{color:#7A887F}
.stub.past small::after{content:' · прошло'}
.stub.next{background:#F2B33D}
.stub.next small{color:#0E1F18}

/* night: one huge quiet photo */
.night{position:relative;height:820px;margin-top:64px}
.night .gr{position:absolute;inset:0}
.night .txt{position:absolute;left:0;right:0;bottom:64px;z-index:2;color:#F7F8F3}
.night h2{font-size:clamp(80px,10vw,168px);text-shadow:0 6px 30px rgba(0,0,0,.4)}
.night p{max-width:560px;font-size:19px;margin:18px 0 10px;text-shadow:0 2px 12px rgba(0,0,0,.6)}

/* tickets: dense */
.tix{padding:110px 0}
.tix-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:end;margin-bottom:40px}
.tix-head h2{font-size:clamp(52px,5.6vw,88px);color:#12392B}
.tix-head p{margin:0;color:#3D4D44}
.tickets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;filter:drop-shadow(0 20px 22px rgba(14,31,24,.18))}
.ticket{display:grid;grid-template-columns:minmax(0,1fr) 92px;min-height:190px;background:#fff;box-shadow:0 1px 0 rgba(14,31,24,.08);transition:transform .2s}
.ticket:hover{transform:translateY(-3px) rotate(-.6deg)}
.ticket .m{padding:22px 20px;display:flex;flex-direction:column;gap:4px}
.ticket .m h3{margin:0 0 8px;font-size:19px;font-weight:600}
.ticket .m span{font-size:15px;color:#3D4D44}
.ticket .m span b{color:#0E1F18}
.ticket .s{border-left:2px dashed #CBD5CD;display:flex;align-items:center;justify-content:center;font-family:'Oranienbaum',serif;font-size:46px;color:#12392B}
.ticket.free{background:#12392B;color:#F7F8F3}
.ticket.free .m span{color:#CFDDD3}
.ticket.free .s{color:#F2B33D;border-color:rgba(247,248,243,.3)}
.tix-more{display:flex;gap:28px;flex-wrap:wrap;align-items:center;margin-top:28px;color:#3D4D44}

/* residents */
.res{background:#E6EEE6;padding:100px 0}
.res h2{font-size:clamp(48px,5vw,80px);color:#12392B}
.legend{display:flex;gap:10px 20px;flex-wrap:wrap;font-size:15px;align-items:center;margin-top:20px;color:#3D4D44}
.legend span{display:inline-flex;align-items:center;gap:8px}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;font-size:13px;font-weight:600;border-radius:3px;color:#0E1F18}
.LC{background:#BFD8B4}.NT{background:#E3DB8C}.VU{background:#F2C46A}.EN{background:#EE8452}.CR{background:#C8352A;color:#fff}
.row-cards{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:16px;margin-top:40px}
.rc{text-decoration:none;color:#0E1F18;display:flex;flex-direction:column;gap:12px}
.rc .gr{height:300px;box-shadow:0 26px 40px -26px rgba(14,31,24,.55);transition:transform .3s, box-shadow .3s}
.rc:hover .gr{transform:translateY(-4px);box-shadow:0 36px 50px -26px rgba(14,31,24,.6)}
.news-main .gr{box-shadow:0 30px 44px -28px rgba(14,31,24,.55)}
.rc:first-child .gr{height:420px}
.rc .tag{position:absolute;top:12px;left:12px;z-index:3}
.rc h3{font-size:38px;color:#12392B}
.rc p{margin:0;font-size:15px;color:#3D4D44}
.rc .z{font-size:14px;font-weight:600}

/* news: plain */
.news{padding:100px 0 110px}
.news h2{font-size:clamp(48px,5vw,80px);color:#12392B;margin-bottom:36px}
.news-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:48px}
.news-main .gr{height:380px}
.news-main h3{font-family:'Oranienbaum',serif;font-weight:400;font-size:40px;line-height:1.05;margin:18px 0 10px}
.cat{display:inline-block;font-size:14px;font-weight:600;color:#C4502E}
.news-list a{display:block;padding:22px 0;border-top:1px solid rgba(14,31,24,.16);text-decoration:none}
.news-list a:last-child{border-bottom:1px solid rgba(14,31,24,.16)}
.news-list h3{font-family:'Oranienbaum',serif;font-weight:400;font-size:30px;line-height:1.1;margin:6px 0 6px}
.news-list p{margin:0;font-size:16px;color:#3D4D44}
.news-list a:hover h3{color:#C4502E}

/* footer */
.foot{background:#0B2A1F;color:#B7CBBE;padding:80px 0 36px}
.foot-top{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:40px}
.foot .logo{color:#F7F8F3}
.foot .logo small{color:#8FA898}
.foot h4{font-size:15px;font-weight:600;color:#F7F8F3;margin:0 0 14px}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:16px}
.foot ul a{text-decoration:none}.foot ul a:hover{color:#F2B33D}
.foot-bot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:64px;padding-top:22px;border-top:1px solid rgba(247,248,243,.14);font-size:13px;color:#8FA898}
.credits{margin-top:16px;font-size:12px;line-height:1.6;color:#7E9587}

@media (max-width:1000px){
  .wrap{padding:0 16px}
  .hero-grid,.map-grid,.tix-head,.news-grid,.foot-top{grid-template-columns:minmax(0,1fr)}
  .place{height:360px}
  .map{height:520px;border-radius:40px}
  .pin .t{font-size:13px}
  .tickets{grid-template-columns:minmax(0,1fr)}
  .row-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rc:first-child .gr,.rc .gr{height:260px}
  .night{height:620px}
  .nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:20px;scrollbar-width:none}.nav a{white-space:nowrap}
  .hero-grid>div:first-child{padding-bottom:24px}
  .am{width:36px;height:36px}
  .stubs{display:flex;overflow-x:auto}
  .stub{flex:0 0 170px}
  .hero h1{font-size:52px}
  .lake{display:none}
}

/* ——— shared kit ——— */
.k-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k-lnk{all:unset;box-sizing:border-box;cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;display:inline-flex;align-items:center;min-height:44px}
.k-lnk:hover{color:#C4502E}
.k-lnk:focus-visible,.k-cart:focus-visible,.k-buy:focus-visible,.k-x:focus-visible,.k-subbtn:focus-visible{outline:3px solid #F2B33D;outline-offset:3px}
.k-hr{display:flex;align-items:center;gap:18px}
.k-cart{position:relative;display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:#12392B;color:#F7F8F3;text-decoration:none;box-shadow:0 10px 18px -10px rgba(11,42,31,.7);transition:transform .2s}
.k-cart:hover{transform:translateY(-2px);color:#F7F8F3}
.k-cart svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.k-cart b{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#F2B33D;color:#0E1F18;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.k-buy{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:stretch;min-height:58px;color:#0E1F18;background:#F2B33D;font-family:'Jost',sans-serif;font-weight:600;font-size:17px;border-radius:8px;transition:transform .2s;
  -webkit-mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat}
.k-buy span{display:flex;align-items:center;padding:0 22px 0 28px}
.k-buy i{font-style:normal;display:flex;align-items:center;padding:0 26px 0 18px;border-left:2px dashed rgba(14,31,24,.35)}
.k-buy:hover{transform:translateY(-2px);color:#0E1F18}
.k-shadow{display:inline-block;filter:drop-shadow(0 12px 14px rgba(150,100,20,.35))}
.k-foot{background:#0B2A1F;color:#B7CBBE;padding:80px 0 36px;font-size:16px}
