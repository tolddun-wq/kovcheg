<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ковчег — поддержать</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="img/favicon.svg">
<script src="js/kovcheg.js"></script>
</head>
<body>
<template id="x-dc">
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&amp;family=Oranienbaum&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F8F3}
a{color:inherit}
.k{font-family:'Jost',system-ui,sans-serif;color:#0E1F18;background:#F7F8F3;font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
.k *{box-sizing:border-box}
.wrap{max-width:1360px;margin:0 auto;padding:0 40px;position:relative}
.d{font-family:'Oranienbaum',serif;font-weight:400;line-height:.95;margin:0}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:92px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#12392B}
.logo svg{width:46px;height:46px}
.logo b{font-family:'Oranienbaum',serif;font-weight:400;font-size:34px;line-height:1}
.logo small{display:block;font-size:13px;color:#4F6157;margin-top:2px}
.nav{display:flex;gap:28px;flex-wrap:wrap}
.nav a{text-decoration:none;font-size:16px;font-weight:500;padding:10px 0}
.nav a:hover{color:#C4502E}
.nav a.on{box-shadow:inset 0 -2px 0 #C4502E}
.tk{-webkit-mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat}
.tkv{-webkit-mask:radial-gradient(circle 12px at 50% 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 12px at 50% 100%,#0000 97%,#000) bottom/100% 51% no-repeat;mask:radial-gradient(circle 12px at 50% 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 12px at 50% 100%,#0000 97%,#000) bottom/100% 51% no-repeat}
.gr{position:relative;overflow:hidden;background:#12392B}
.gr img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.78) contrast(1.06) brightness(.98) sepia(.14)}
.gr::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(242,179,61,.12) 0%,rgba(18,57,43,.22) 100%);mix-blend-mode:multiply}
.lbl2{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:600;color:#C4502E}
.lbl2::before{content:'';width:44px;height:2px;background:currentColor;flex:none}
.bk{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;border-radius:999px;background:#F2B33D;color:#0E1F18;font-weight:600;font-size:16px;white-space:nowrap;transition:transform .2s}
.bk:hover{transform:translateY(-2px)}
.bk:focus-visible{outline:3px solid #12392B;outline-offset:2px}
.bk.ghost{background:transparent;box-shadow:inset 0 0 0 2px currentColor}

.intro{padding:56px 0 90px}
.intro-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px;align-items:end}
.intro h1{font-size:clamp(84px,10vw,150px);color:#12392B}
.intro p{font-size:20px;color:#3D4D44;margin:20px 0 0;max-width:560px}
.intro .gr{height:440px;border-radius:220px 220px 6px 6px;box-shadow:0 40px 60px -40px rgba(14,31,24,.6)}
.ways{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.ways a{padding:10px 18px;border-radius:999px;background:#E3EBE1;text-decoration:none;font-weight:600;font-size:16px}
.ways a:hover{background:#12392B;color:#F7F8F3}

.adopt{background:#12392B;color:#F7F8F3;padding:100px 0}
.adopt h2,.don h2,.vol h2,.corp h2{font-size:clamp(56px,6vw,92px);margin:14px 0 0}
.adopt .lbl2{color:#F2B33D}
.adopt .sub{max-width:640px;color:#C9D6CE;margin:18px 0 0}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:48px;filter:drop-shadow(0 26px 30px rgba(0,0,0,.35))}
.lev{background:#F7F8F3;color:#0E1F18;padding:30px 26px 26px;display:flex;flex-direction:column}
.lev.hot{background:#F2B33D}
.lev small{font-size:14px;font-weight:600;color:#C4502E;text-transform:uppercase;letter-spacing:.06em}
.lev.hot small{color:#12392B}
.lev h3{font-family:'Oranienbaum',serif;font-weight:400;font-size:44px;line-height:1;margin:8px 0 6px;color:#12392B}.lev h3 span{font-family:'Jost',sans-serif;font-size:16px;color:#4F6157}.kin{margin:0;font-size:15px;color:#4F6157}.adopt-go{margin-top:24px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form textarea{width:100%;min-height:90px;padding:14px 16px;border-radius:6px;border:0;background:#F7F8F3;font:inherit;font-size:16px}.lnk2{display:inline-block;margin-top:16px;font-weight:600;color:#C4502E}
.lev .pr{font-family:'Oranienbaum',serif;font-size:56px;line-height:1;color:#12392B}
.lev .pr span{font-family:'Jost',sans-serif;font-size:16px;color:#4F6157}
.lev ul{list-style:none;padding:18px 0;margin:18px 0;border-top:2px dashed rgba(14,31,24,.18);display:flex;flex-direction:column;gap:8px;font-size:15px;flex:1}
.lev li{display:flex;gap:10px}
.lev li::before{content:'✓';color:#C4502E;font-weight:700}
.lev .bk{width:100%}
.lev.hot .bk{background:#12392B;color:#F7F8F3}
.who{margin-top:56px}
.who h3{font-family:'Oranienbaum',serif;font-weight:400;font-size:36px;margin:0 0 20px}
.picks{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:14px}
.pick{all:unset;box-sizing:border-box;cursor:pointer;display:block;border-radius:6px;overflow:hidden;background:#1C4A38;transition:transform .2s;position:relative}
.pick:hover{transform:translateY(-4px)}
.pick .gr{height:150px}
.pick span{display:block;padding:12px 14px;font-weight:600;font-size:16px}
.pick em{display:block;font-style:normal;font-size:13px;color:#A9BDB1;font-weight:400}
.pick.on{box-shadow:0 0 0 3px #F2B33D}
.pick.on::after{content:'✓';position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:#F2B33D;color:#12392B;display:grid;place-items:center;font-weight:700;z-index:3}

.don{padding:100px 0}
.don-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:start}
.don p{color:#3D4D44}
.amts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:24px 0}
.amt{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:16px 0;border-radius:6px;background:#fff;box-shadow:inset 0 0 0 2px #DCE6DF;font-family:'Oranienbaum',serif;font-size:32px;line-height:1}
.amt.on{background:#12392B;color:#F7F8F3;box-shadow:none}
.amt small{display:block;font-family:'Jost',sans-serif;font-size:12px;margin-top:4px;color:inherit;opacity:.7}
.what{background:#fff;border-radius:6px;padding:22px 24px;display:flex;gap:18px;align-items:center;box-shadow:0 20px 30px -24px rgba(14,31,24,.5)}
.what b{font-family:'Oranienbaum',serif;font-weight:400;font-size:44px;color:#C4502E;line-height:1}
.freq{display:flex;gap:6px;background:#E3EBE1;border-radius:999px;padding:4px;width:max-content;margin-top:20px}
.freq button{all:unset;cursor:pointer;padding:8px 18px;border-radius:999px;font-weight:600;font-size:15px}
.freq button.on{background:#fff;box-shadow:0 4px 10px -6px rgba(14,31,24,.5)}
.don-go{display:flex;gap:14px;align-items:center;margin-top:24px;flex-wrap:wrap}
.spend{background:#E3EBE1;border-radius:6px;padding:34px}
.spend h3{font-family:'Oranienbaum',serif;font-weight:400;font-size:38px;margin:0 0 18px}
.bar{margin:0 0 16px}
.bar div{display:flex;justify-content:space-between;font-size:16px;margin-bottom:6px}
.bar i{display:block;height:10px;border-radius:5px;background:#fff;overflow:hidden}
.bar i b{display:block;height:100%;background:#12392B;border-radius:5px}
.spend .gr{height:220px;border-radius:6px;margin-top:24px}

.vol{background:#E3EBE1;padding:100px 0}
.vol-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px}
.vol ul{padding:0;list-style:none;margin:24px 0 0;display:flex;flex-direction:column;gap:12px}
.vol li{background:#fff;border-radius:6px;padding:16px 20px;display:flex;justify-content:space-between;gap:16px}
.vol li span{color:#4F6157;font-size:15px}
.form{background:#12392B;color:#F7F8F3;border-radius:6px;padding:34px;box-shadow:0 40px 50px -30px rgba(14,31,24,.6)}
.form h3{font-family:'Oranienbaum',serif;font-weight:400;font-size:38px;margin:0 0 18px}
.form label{display:block;font-size:14px;color:#C9D6CE;margin:14px 0 6px}
.form input,.form select{width:100%;padding:14px 16px;border-radius:6px;border:0;background:#F7F8F3;font:inherit;font-size:16px;color:#0E1F18}
.form .bk{margin-top:22px;width:100%}

.corp{padding:100px 0}
.corp-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:40px}
.cc{border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 20px 30px -24px rgba(14,31,24,.5)}
.cc .gr{height:200px}
.cc div.t{padding:24px}
.cc h3{font-family:'Oranienbaum',serif;font-weight:400;font-size:32px;margin:0 0 8px}
.cc p{margin:0;color:#3D4D44;font-size:16px}
.corp .go{margin-top:36px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}

/* ——— shared kit ——— */
.k-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k-lnk{all:unset;box-sizing:border-box;cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;display:inline-flex;align-items:center;min-height:44px}
.k-lnk:hover{color:#C4502E}
.k-lnk:focus-visible,.k-cart:focus-visible,.k-buy:focus-visible,.k-x:focus-visible,.k-subbtn:focus-visible{outline:3px solid #F2B33D;outline-offset:3px}
.k-hr{display:flex;align-items:center;gap:18px}
.k-cart{position:relative;display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:#12392B;color:#F7F8F3;text-decoration:none;box-shadow:0 10px 18px -10px rgba(11,42,31,.7);transition:transform .2s}
.k-cart:hover{transform:translateY(-2px);color:#F7F8F3}
.k-cart svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.k-cart b{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#F2B33D;color:#0E1F18;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.k-buy{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:stretch;min-height:58px;color:#0E1F18;background:#F2B33D;font-family:'Jost',sans-serif;font-weight:600;font-size:17px;border-radius:8px;transition:transform .2s;
  -webkit-mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat}
.k-buy span{display:flex;align-items:center;padding:0 22px 0 28px}
.k-buy i{font-style:normal;display:flex;align-items:center;padding:0 26px 0 18px;border-left:2px dashed rgba(14,31,24,.35)}
.k-buy:hover{transform:translateY(-2px);color:#0E1F18}
.k-shadow{display:inline-block;filter:drop-shadow(0 12px 14px rgba(150,100,20,.35))}
.k-foot{background:#0B2A1F;color:#B7CBBE;padding:80px 0 36px;font-size:16px}
.k-foot .logo{color:#F7F8F3}.k-foot .logo small{color:#8FA898}
.k-foot-top{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:40px}
.k-faddr{margin:22px 0 0;line-height:1.6}
.k-faddr .k-lnk{min-height:0;color:#F7F8F3}
.k-foot h4{font-size:15px;font-weight:600;color:#F7F8F3;margin:0 0 14px}
.k-foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.k-foot ul a,.k-foot-bot a{text-decoration:none}.k-foot ul a:hover,.k-foot-bot a:hover{color:#F2B33D}
.k-sub{display:flex;gap:8px;margin-top:24px;max-width:460px}
.k-sub input{flex:1;min-width:0;height:50px;padding:0 16px;border-radius:6px;border:1.5px solid rgba(247,248,243,.3);background:rgba(247,248,243,.06);color:#F7F8F3;font:inherit}
.k-sub input::placeholder{color:#8FA898}
.k-subbtn{all:unset;box-sizing:border-box;cursor:pointer;height:50px;padding:0 20px;border-radius:6px;background:#F2B33D;color:#0E1F18;font-weight:600}
.k-foot-bot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:56px;padding-top:22px;border-top:1px solid rgba(247,248,243,.14);font-size:13px;color:#8FA898}
.k-credits{margin:14px 0 0;font-size:12px;line-height:1.6;color:#7E9587}
.k-veil{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(6,20,14,.62);backdrop-filter:blur(4px)}
.k-modal{position:relative;width:min(580px,100%);background:#12392B;color:#F7F8F3;border-radius:8px;border:6px solid #0F3123;padding:40px 38px 32px;box-shadow:0 2px 0 #0B2A1F,0 50px 90px -24px rgba(0,0,0,.75)}
.k-bolt{position:absolute;top:10px;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#EDE8DA,#8E8A7E)}
.k-mtag{display:inline-block;padding:4px 12px;border-radius:999px;background:#F2B33D;color:#0E1F18;font-size:13px;font-weight:600}
.k-mh{font-family:'Oranienbaum',serif;font-weight:400;font-size:44px;line-height:1;margin:16px 0 14px}
.k-mp{margin:0;color:#CFDDD3;font-size:17px;line-height:1.55}
.k-mrow{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:26px}
.k-back{color:#F7F8F3}
.k-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:55;display:flex;align-items:center;gap:16px;padding:12px 12px 12px 20px;border-radius:8px;background:#12392B;color:#F7F8F3;box-shadow:0 24px 40px -14px rgba(0,0,0,.6);font-size:15px;max-width:calc(100% - 32px)}
.k-toastgo{padding:10px 16px;border-radius:6px;background:#F2B33D;color:#0E1F18;font-weight:600;text-decoration:none;white-space:nowrap}
.k-x{all:unset;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#B7CBBE}
.k-field{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:600}
.k-field input,.k-field select,.k-field textarea{font:inherit;font-weight:400;font-size:17px;padding:13px 15px;border:1.5px solid #CBD5CD;border-radius:6px;background:#fff;color:#0E1F18}
.k-field textarea{min-height:120px;resize:vertical}
.k-field input:focus,.k-field select:focus,.k-field textarea:focus{outline:3px solid #F2B33D;outline-offset:1px;border-color:#12392B}
.k-check{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4}
.k-check input{width:20px;height:20px;margin:2px 0 0;accent-color:#12392B}
@media (max-width:1000px){
  .k-foot-top{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .k-foot-top>div:first-child{grid-column:1 / -1}
  .k-hr .k-lnk{display:none}
  .k-modal{padding:32px 20px 24px}
  .k-mh{font-size:34px}
  .k-toast{left:16px;right:16px;transform:none;flex-wrap:wrap}
}

@media (max-width:1000px){
  .wrap{padding:0 16px}
  .intro-grid,.don-grid,.vol-grid,.corp-row{grid-template-columns:minmax(0,1fr)}
  .levels{grid-template-columns:minmax(0,1fr)}
  .picks{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}
  .amts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .intro .gr{height:300px}
  .adopt,.don,.vol,.corp{padding:64px 0}
  .nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:20px;scrollbar-width:none}.nav a{white-space:nowrap}
}
</style>
</helmet>

<div class="k">
  <header class="hdr"><div class="wrap">
    <a class="logo" href="index.html" aria-label="Ковчег, на главную">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M11.5 19 L20 11.5 L28.5 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></path><rect x="14.5" y="19" width="11" height="7" fill="none" stroke="currentColor" stroke-width="2.4"></rect><path d="M4 26 H36 L31 33 H9 Z" fill="currentColor"></path><path d="M5 37.5 q3.75 -2.5 7.5 0 t7.5 0 t7.5 0 t7.5 0" fill="none" stroke="#F2B33D" stroke-width="2" stroke-linecap="round"></path></svg>
      <span><b>Ковчег</b><small>зоопарк, Минск</small></span>
    </a>
    <nav class="nav" aria-label="Главное меню">
      <a href="animals.html">Животные</a>
      <a href="index.html#map">Карта</a>
      <a href="tickets.html">Билеты</a>
      <a href="experiences.html">Впечатления</a>
      <a href="visit.html">Как добраться</a>
      <a href="about.html">О зоопарке</a>
    </nav>
    <div class="k-hr">
      <button class="k-lnk" type="button" onClick="{{callDemo}}">+375 17 000-00-00</button>
      <a class="k-cart" href="cart.html" aria-label="Корзина"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg><sc-if value="{{hasCart}}"><b>{{cartCount}}</b></sc-if></a>
    </div>
  </div></header>

  <section class="intro">
    <div class="wrap"><div class="intro-grid">
      <div>
        <div class="lbl2">Помочь «Ковчегу»</div>
        <h1 class="d">Вы можете стать частью команды</h1>
        <p>Три способа помочь: взять животное под опеку, стать волонтёром, перевести пожертвование. А компаниям — стать партнёром вольера.</p>
        <div class="ways"><a href="#adopt">Опека над животным</a><a href="#donate">Пожертвование</a><a href="#volunteer">Волонтёрство</a><a href="#corp">Компаниям</a></div>
      </div>
      <div class="gr"><img src="img/redpanda.jpg" alt="Красная панда на ветке"></div>
    </div></div>
  </section>

  <section class="adopt" id="adopt">
    <div class="wrap">
      <div class="lbl2">Опека</div>
      <h2 class="d">Станьте «крёстным» животного</h2>
      <p class="sub">Опекун не забирает животное домой: он платит часть его рациона. В пакет входят сертификат, фото питомца, имя на табличке у вольера и ежеквартальное письмо от зоолога.</p>

      <div class="who">
        <h3>Выберите подопечного</h3>
        <div class="picks">
          <sc-for list="{{animals}}" as="a">
            <button class="{{a.cls}}" onClick="{{a.choose}}"><div class="gr"><img src="{{a.img}}" alt="{{a.name}}"></div><span>{{a.name}}<em>{{a.sub}}</em></span></button>
          </sc-for>
        </div>
        <div class="adopt-go"><button class="bk" onClick="{{adoptNow}}">{{adoptBtn}}</button></div>
      </div>

      <div class="levels">
        <div class="{{lv.small}}"><small>Малый</small><h3>120 Br <span>в год</span></h3><p class="kin">кролик, коза, сурикат, утка, павлин</p><ul><li>сертификат</li><li>фото питомца</li><li>имя на табличке у вольера</li></ul></div>
        <div class="{{lv.mid}}"><small>Средний</small><h3>360 Br <span>в год</span></h3><p class="kin">рысь, волк, лемур, пингвин, кенгуру, коала</p><ul><li>всё из «Малого»</li><li>2 билета в год</li><li>встреча с животным у вольера</li></ul></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4600}}'>
class Component extends DCLogic {
  kitInit() {
    let n = 0;
    try { const c = JSON.parse(localStorage.getItem('kovcheg-cart') || '[]'); n = c.reduce((s, x) => s + (x.qty || 0), 0); } catch (e) {}
    this.setState({ cartCount: n });
    setTimeout(() => { try { const h = location.hash.slice(1); const el = h && document.getElementById(h); if (el) el.scrollIntoView(); } catch (e) {} }, 60);
  }
  addToCart(item) {
    let c = null;
    try { c = JSON.parse(localStorage.getItem('kovcheg-cart') || '[]'); } catch (e) { c = null; }
    if (c) {
      const f = c.find(x => x.id === item.id);
      if (f) f.qty += item.qty || 1; else c.push({ ...item, qty: item.qty || 1 });
      try { localStorage.setItem('kovcheg-cart', JSON.stringify(c)); } catch (e) {}
      this.setState({ cartCount: c.reduce((s, x) => s + x.qty, 0), toast: item.label });
    } else {
      this.setState({ cartCount: ((this.state && this.state.cartCount) || 0) + (item.qty || 1), toast: item.label });
    }
  }
  kit() {
    const s = this.state || {};
    return {
      demo: !!s.demo, isAnimal: s.demoKind === 'animal',
      demoTitle: s.demoKind === 'animal' ? 'Страница есть только у Алтая' : (s.demoWhat || 'Эта функция') + ' — только в настоящем сайте',
      demoText: s.demoKind === 'animal' ? 'В демо-версии сделана одна страница жителя — амурский тигр Алтай. Страницы остальных животных появятся в настоящем сайте. Хотите такой сайт — напишите мне в Telegram.' : '«Ковчег» — демо-проект для портфолио, зоопарк вымышленный, поэтому оплата, звонки и отправка форм здесь не работают. Хотите такой же сайт для своего бизнеса — напишите мне в Telegram, обсудим.',
      cartCount: s.cartCount || 0, hasCart: (s.cartCount || 0) > 0,
      toastOn: !!s.toast, toast: s.toast || '',
      closeToast: () => this.setState({ toast: '' }),
      callDemo: () => this.setState({ demo: true, demoKind: '', demoWhat: 'Звонок' }),
      mailDemo: () => this.setState({ demo: true, demoKind: '', demoWhat: 'Письмо' }),
      payDemo: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ demo: true, demoKind: '', demoWhat: 'Оплата' }); },
      formDemo: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ demo: true, demoKind: '', demoWhat: 'Отправка формы' }); },
      animalDemo: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ demo: true, demoKind: 'animal' }); },
      closeDemo: () => this.setState({ demo: false })
    };
  }
  componentDidMount() { this.kitInit(); }
  constructor(p) { super(p); this.state = { pick: 5, amt: 2, monthly: false }; }
  renderVals() {
    const s = this.state || {};
    const L = { small: ['Малый', 120], mid: ['Средний', 360], big: ['Большой', 900] };
    const A = [
      ['Сурикат', 'small', 'img/meerkat.jpg'],
      ['Коза', 'small', 'img/goat.jpg'],
      ['Пингвин', 'mid', 'img/penguin.jpg'],
      ['Коала', 'mid', 'img/koala.jpg'],
      ['Рысь', 'mid', 'img/lynx.jpg'],
      ['Амурский тигр', 'big', 'img/tiger.jpg'],
      ['Жираф', 'big', 'img/giraffe.jpg'],
      ['Белый медведь', 'big', 'img/polar.jpg']
    ];
    const pick = s.pick == null ? 5 : s.pick;
    const [name, lk] = A[pick];
    const V = [5, 20, 50, 150, 500];
    const M = ['мешок моркови кроликам на неделю', 'обед для пингвинов на день', 'лечение одного дикого птенца в центре помощи', 'рацион жирафа на месяц', 'оборудование для обогащения среды в вольере тигров'];
    const ai = s.amt == null ? 2 : s.amt;
    const amount = V[ai];
    const lvCls = k => 'lev tkv' + (k === lk ? ' hot' : '');
    return { ...this.kit(),
      pickName: name, adoptBtn: 'Оформить опеку: ' + name + ' · ' + L[lk][1] + ' Br в год', donateBtn: 'Пожертвовать ' + amount + ' Br',
      animals: A.map((x, i) => ({ name: x[0], sub: 'уровень «' + L[x[1]][0] + '» · ' + L[x[1]][1] + ' Br', img: x[2], cls: 'pick' + (i === pick ? ' on' : ''), choose: () => this.setState({ pick: i }) })),
      lv: { small: lvCls('small'), mid: lvCls('mid'), big: lvCls('big') },
      adoptNow: () => this.addToCart({ id: 'adopt-' + pick, kind: 'Опека', label: 'Опека «' + L[lk][0] + '» · ' + name + ' · год', price: L[lk][1] }),
      amounts: V.map((v, i) => ({ v, cls: 'amt' + (i === ai ? ' on' : ''), choose: () => this.setState({ amt: i }) })),
      amount, amountMeans: '= ' + M[ai],
      onceCls: s.monthly ? '' : 'on', monthCls: s.monthly ? 'on' : '',
      setOnce: () => this.setState({ monthly: false }), setMonth: () => this.setState({ monthly: true }),
      freqNote: s.monthly ? 'первый платёж сейчас, дальше — раз в месяц' : 'разовый платёж',
      donate: () => this.addToCart({ id: 'donate-' + amount + (s.monthly ? '-m' : ''), kind: 'Пожертвование', label: (s.monthly ? 'Ежемесячно · ' : 'Пожертвование · ') + amount + ' Br', price: amount })
    };
  }
}
</script>
