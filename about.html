  <section class="hero">
    <div class="wrap">
      <span class="since">с 2009 года</span>
      <div class="lbl2">О зоопарке</div>
      <h1 class="d">Разве зоопарк — это просто клетки?</h1>
      <div class="row">
        <p>«Ковчег» строили на одной идее: животное должно жить так, будто его дом — не витрина. Здесь меньше решёток, больше простора и природных укрытий, а ваша задача — просто идти и удивляться.</p>
        <div class="gr"><img src="img/bear.jpg" alt="Бурый медведь в вольере"></div>
      </div>
    </div>
  </section>

  <section class="hist">
    <div class="wrap">
      <div class="lbl2">История</div>
      <h2 class="d">От пустыря до семи миров</h2>
      <div class="line">
        <div class="yr"><b>Начало</b><p>В 2009 году на пустыре на окраине Минска появились первые вольеры: для животных, которых приютили после закрытия передвижных цирков. В тот год в парке жило 140 животных и работало 18 человек.</p></div>
        <div class="yr"><b>Рост</b><p>За четырнадцать лет «Ковчег» вырос до 42 гектаров и семи тематических зон. Теперь здесь 3 200 животных и 214 сотрудников: зоологи, ветеринары, биологи, садовники, педагоги.</p></div>
        <div class="yr"><b>Сейчас</b><p>Мы участвуем в международных программах разведения редких видов, выпускаем в природу белорусских животных и принимаем школьников на уроки прямо у вольеров.</p></div>
      </div>
    </div>
  </section>

  <section class="pr">
    <div class="wrap">
      <div class="lbl2">Принципы</div>
      <h2 class="d" style="color:#12392B">Четыре принципа</h2>
      <div class="pr-grid">
        <div class="pc"><div class="gr"><img src="img/pr-home.jpg" alt="Просторный вольер"></div><div class="t"><h3>Дом, а не клетка</h3><p>Вольеры повторяют природную среду: грунт, растения, места для уединения. Все животные могут спрятаться от посетителей, если хотят.</p></div></div>
        <div class="pc"><div class="gr"><img src="img/pr-care.jpg" alt="Смотритель и черепаха"></div><div class="t"><h3>Забота без исключений</h3><p>Свой ветеринарный центр работает круглосуточно. Каждое животное осматривают не реже раза в год.</p></div></div>
        <div class="pc"><div class="gr"><img src="img/pr-honest.jpg" alt="Животное в естественной среде"></div><div class="t"><h3>Честность</h3><p>Мы рассказываем, откуда пришло каждое животное и что с ним будет дальше. Никаких селфи с дикими детёнышами, никаких шоу с трюками.</p></div></div>
        <div class="pc"><div class="gr"><img src="img/pr-edu.jpg" alt="Зоологи с пингвинами"></div><div class="t"><h3>Просвещение</h3><p>До четырёх раз в день у вольеров рассказывают о том, кто в них живёт. Понимание — главный результат визита.</p></div></div>
      </div>
    </div>
  </section>

  <section class="nums">

      <div class="lbl2">Итоги 2025 года</div>

        <div class="num tkv"><b>1,2 млн</b><span>посетителей за год</span></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":5200}}'>
class Component extends DCLogic {
  kitInit() {
    let n = 0;
    try { const c = JSON.parse(localStorage.getItem('kovcheg-cart') || '[]'); n = c.reduce((s, x) => s + (x.qty || 0), 0); } catch (e) {}
    this.setState({ cartCount: n });
    setTimeout(() => { try { const h = location.hash.slice(1); const el = h && document.getElementById(h); if (el) el.scrollIntoView(); } catch (e) {} }, 60);
  }
  addToCart(item) {
    let c = null;
    try { c = JSON.parse(localStorage.getItem('kovcheg-cart') || '[]'); } catch (e) { c = null; }
    if (c) {
      const f = c.find(x => x.id === item.id);
      if (f) f.qty += item.qty || 1; else c.push({ ...item, qty: item.qty || 1 });
      try { localStorage.setItem('kovcheg-cart', JSON.stringify(c)); } catch (e) {}
      this.setState({ cartCount: c.reduce((s, x) => s + x.qty, 0), toast: item.label });
    } else {
      this.setState({ cartCount: ((this.state && this.state.cartCount) || 0) + (item.qty || 1), toast: item.label });
    }
  }
  kit() {
    const s = this.state || {};
    return {
      demo: !!s.demo, isAnimal: s.demoKind === 'animal',
      demoTitle: s.demoKind === 'animal' ? 'Страница есть только у Алтая' : (s.demoWhat || 'Эта функция') + ' — только в настоящем сайте',
      demoText: s.demoKind === 'animal' ? 'В демо-версии сделана одна страница жителя — амурский тигр Алтай. Страницы остальных животных появятся в настоящем сайте. Хотите такой сайт — напишите мне в Telegram.' : '«Ковчег» — демо-проект для портфолио, зоопарк вымышленный, поэтому оплата, звонки и отправка форм здесь не работают. Хотите такой же сайт для своего бизнеса — напишите мне в Telegram, обсудим.',
      cartCount: s.cartCount || 0, hasCart: (s.cartCount || 0) > 0,
      toastOn: !!s.toast, toast: s.toast || '',
      closeToast: () => this.setState({ toast: '' }),
      callDemo: () => this.setState({ demo: true, demoKind: '', demoWhat: 'Звонок' }),
      mailDemo: () => this.setState({ demo: true, demoKind: '', demoWhat: 'Письмо' }),
      payDemo: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ demo: true, demoKind: '', demoWhat: 'Оплата' }); },
      formDemo: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ demo: true, demoKind: '', demoWhat: 'Отправка формы' }); },
      animalDemo: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ demo: true, demoKind: 'animal' }); },
      closeDemo: () => this.setState({ demo: false })
    };
  }
  componentDidMount() { this.kitInit(); }
  renderVals() { return { ...this.kit() }; }
}
</script>
